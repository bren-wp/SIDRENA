# Sidrena source file.
# Author: brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: Sidrena Plugin Check

on:
  push:
    branches:
      - main
      - 'develop/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Plugin Check packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check --quiet reportlab

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build production-shaped packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/plugin-check
          ./tools/build-editions.sh "${{ steps.version.outputs.version }}" build/plugin-check
          test -f build/plugin-check/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici/sidrena-wordpress.php
          test -f build/plugin-check/.sidrena-build/brendigo-sidrene-cijene-cjenici/sidrena-woocommerce.php
          mkdir -p build/plugin-check-packages
          cp -a build/plugin-check/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici build/plugin-check-packages/
          cp -a build/plugin-check/.sidrena-build/brendigo-sidrene-cijene-cjenici build/plugin-check-packages/

      - name: Upload Plugin Check packages
        uses: actions/upload-artifact@v7
        with:
          name: sidrena-plugin-check-build
          path: build/plugin-check-packages
          if-no-files-found: error


  wordpress:
    name: Plugin Check — WordPress edition
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install deterministic WordPress runtime tooling
        shell: bash
        run: bash tools/install-wp-env.sh "$RUNNER_TEMP/sidrena-wp-env"

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sidrena-plugin-check-build
          path: build/plugin-check-packages

      - name: Run WordPress Plugin Check
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-plugin-check.sh \
            build/plugin-check-packages/brendigo-sidrene-cijene-digitalni-cjenici \
            brendigo-sidrene-cijene-digitalni-cjenici \
            "$RUNNER_TEMP/plugin-check-wordpress.json"

      - name: Upload Plugin Check result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-check-results-brendigo-sidrene-cijene-digitalni-cjenici
          path: ${{ runner.temp }}/plugin-check-wordpress.json
          if-no-files-found: warn

  woocommerce:
    name: Plugin Check — WooCommerce edition
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install deterministic WordPress runtime tooling
        shell: bash
        run: bash tools/install-wp-env.sh "$RUNNER_TEMP/sidrena-wp-env"

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sidrena-plugin-check-build
          path: build/plugin-check-packages

      - name: Run WordPress Plugin Check
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-plugin-check.sh \
            build/plugin-check-packages/brendigo-sidrene-cijene-cjenici \
            brendigo-sidrene-cijene-cjenici \
            "$RUNNER_TEMP/plugin-check-woocommerce.json"

      - name: Upload Plugin Check result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-check-results-brendigo-sidrene-cijene-cjenici
          path: ${{ runner.temp }}/plugin-check-woocommerce.json
          if-no-files-found: warn
