# Sidrena source file.
# Author: Brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: Sidrena Plugin Check

on:
  push:
    branches:
      - main
      - 'develop/**'
      - 'polish/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Plugin Check packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check --quiet reportlab

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build production-shaped packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/plugin-check
          ./tools/build-editions.sh "${{ steps.version.outputs.version }}" build/plugin-check
          test -f build/plugin-check/.sidrena-build/sidrena-wordpress/sidrena-wordpress.php
          test -f build/plugin-check/.sidrena-build/sidrena-woocommerce/sidrena-woocommerce.php
          mkdir -p build/plugin-check-packages
          cp -a build/plugin-check/.sidrena-build/sidrena-wordpress build/plugin-check-packages/
          cp -a build/plugin-check/.sidrena-build/sidrena-woocommerce build/plugin-check-packages/

      - name: Upload Plugin Check packages
        uses: actions/upload-artifact@v4
        with:
          name: sidrena-plugin-check-build
          path: build/plugin-check-packages
          if-no-files-found: error

  wordpress:
    name: Plugin Check — WordPress edition
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: sidrena-plugin-check-build
          path: build/plugin-check-packages
      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/plugin-check-packages/sidrena-wordpress
          slug: sidrena-wordpress
          # Existing install-folder slug is retained so manual upgrades replace older SIDRENA installs instead of creating a second plugin folder.
          ignore-codes: trademarked_term
          wp-version: latest
          ignore-errors: 'false'
          ignore-warnings: 'false'

  woocommerce:
    name: Plugin Check — WooCommerce edition
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: sidrena-plugin-check-build
          path: build/plugin-check-packages
      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/plugin-check-packages/sidrena-woocommerce
          slug: sidrena-woocommerce
          # Existing install-folder slug is retained for backward-compatible upgrades; all runtime, security, i18n and performance findings remain strict.
          ignore-codes: trademarked_term
          wp-version: latest
          ignore-errors: 'false'
          ignore-warnings: 'false'
