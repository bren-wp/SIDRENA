name: Sidrena admin polish guard

on:
  push:
    branches:
      - main
      - develop/**
      - feature/**
  pull_request:
    branches:
      - main
      - develop/**

permissions:
  contents: read

jobs:
  admin-polish-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Sidrena 1.0.3 brand and cleanup invariants
        run: |
          set -euo pipefail
          php -l includes/sidrena-bootstrap.php
          php -l includes/sidrena-edition-guard.php
          test -s includes/sidrena-edition-guard.php
          php -l includes/class-sidrena-admin-menu.php
          test -s assets/images/menu-anchor.svg
          test -s assets/images/app-icon.svg
          test -s assets/images/logo-horizontal-light.svg
          test -s assets/images/logo-wordpress-light.svg
          test -s assets/images/logo-woocommerce-light.svg
          test -s assets/images/brand-hero.svg
          test -s admin/css/brand.css
          test -s branding/BRAND-GUIDE.md
          grep -Fq "SIDRENA_URL . 'assets/images/menu-anchor.svg'" includes/class-sidrena-admin-menu.php
          grep -Fq "'assets/images/logo-woocommerce-light.svg' : 'assets/images/logo-wordpress-light.svg'" includes/class-sidrena-admin.php
          grep -Fq "admin/css/brand.css" includes/class-sidrena-admin.php
          grep -Fq "sidrena-edition-body-' . \$edition" includes/class-sidrena-admin.php
          grep -Fq "Sidrena_Admin_Menu::items()" includes/class-sidrena-admin-ux.php
          grep -Fq "pending = {}" public/js/compat.js
          if grep -q '\.sidrena-wrap' admin/css/admin.css; then
            echo "Legacy .sidrena-wrap CSS must not return to the editor-only stylesheet."
            exit 1
          fi
          if grep -RInF 'sidrena_neutralize_admin_menu_icon' includes; then
            echo "Obsolete menu icon neutralizer must not return."
            exit 1
          fi
          if [ -f .github/workflows/production-polish-automation.yml ]; then
            echo "Temporary production polish workflow must not be shipped."
            exit 1
          fi
