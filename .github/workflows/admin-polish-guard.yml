name: Sidrena admin polish guard

on:
  push:
    branches:
      - main
      - develop/**
      - feature/**
  pull_request:
    branches:
      - main
      - develop/**

permissions:
  contents: read

jobs:
  admin-polish-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify compact Sidrena admin branding
        run: |
          set -euo pipefail
          php -l includes/sidrena-bootstrap.php
          php -l includes/class-sidrena-admin-menu.php
          test -s assets/images/menu-anchor.svg
          grep -Fq "SIDRENA_URL . 'assets/images/menu-anchor.svg'" includes/class-sidrena-admin-menu.php
          grep -Fq "SIDRENA_URL . 'assets/images/logo-mark.svg'" includes/class-sidrena-admin.php
          if grep -RInF 'sidrena_neutralize_admin_menu_icon' includes; then
            echo "Obsolete menu icon neutralizer must not return."
            exit 1
          fi
          if [ -f .github/workflows/production-polish-automation.yml ]; then
            echo "Temporary production polish workflow must not be shipped."
            exit 1
          fi
