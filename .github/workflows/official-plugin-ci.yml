name: Official Brendigo Sidrena Cijena checks
on:
  pull_request:
    paths:
      - 'wordpress/brendigo-sidrena-cijena/**'
      - 'tools/package_plugin.py'
      - 'tools/test_legal_contract.php'
      - '.github/workflows/official-plugin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/brendigo-sidrena-cijena/**'
      - 'tools/package_plugin.py'
      - 'tools/test_legal_contract.php'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate WordPress version and legal contract
        run: |
          test -f wordpress/brendigo-sidrena-cijena/brendigo-sidrena-cijena.php
          test -f wordpress/brendigo-sidrena-cijena/includes/class-legal.php
          grep -q 'Stable tag: 1.5.3' wordpress/brendigo-sidrena-cijena/readme.txt
      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/brendigo-sidrena-cijena -name '*.php' -type f -print0 |
            xargs -0 -n 1 php -l > /tmp/sidrena-lint.log
          tail -n 3 /tmp/sidrena-lint.log
      - name: Test shared legal contract
        run: php tools/test_legal_contract.php
      - name: Package reproducibly and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_plugin.py --version 1.5.3 --output artifacts/brendigo-sidrena-cijena-1.5.3.zip
          (cd artifacts && sha256sum -c brendigo-sidrena-cijena-1.5.3.zip.sha256)
          python3 tools/package_plugin.py --version 1.5.3 --output /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.3.zip
          cmp artifacts/brendigo-sidrena-cijena-1.5.3.zip /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.3.zip
