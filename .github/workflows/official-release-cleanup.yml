name: Retain only official Brendigo 1.5.0 release and tag

on:
  push:
    branches:
      - feature/release-cleanup-1.5.0-and-desktop
    paths:
      - '.github/workflows/official-release-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidrena-official-release-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Build verified 1.5.0 package and remove seven obsolete releases/tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: bren-wp/SIDRENA
      GH_TOKEN: \${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify official plugin file manifest and build the only release ZIP
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path('wordpress/brendigo-sidrena-cijena')
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          digest=hashlib.sha256(''.join(f'{name} {files[name]}\n' for name in sorted(files)).encode()).hexdigest()
          assert len(files)==128, f'Unexpected official file count: {len(files)}'
          assert digest=='44b6ff17478f7769d9bda8157020269247f9dad2c186d92b82ddfbd21e996387', 'Source differs from owner-provided ZIP'
          assert b'Version: 1.5.0' in (root/'brendigo-sidrena-cijena.php').read_bytes()
          pathlib.Path('release-package').mkdir(exist_ok=True)
          package=pathlib.Path('release-package/brendigo-sidrena-cijena-1.5.0.zip')
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as output:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      output.write(file,arcname='brendigo-sidrena-cijena/'+file.relative_to(root).as_posix())
          with zipfile.ZipFile(package) as check:
              restored={p[len('brendigo-sidrena-cijena/'):]:hashlib.sha256(check.read(p)).hexdigest() for p in check.namelist() if not p.endswith('/')}
          assert restored==files,'Generated ZIP does not match verified official source'
          digest=hashlib.sha256(package.read_bytes()).hexdigest()
          (package.parent/(package.name+'.sha256')).write_text(f'{digest}  {package.name}\n',encoding='utf-8')
          print(f'Official package verified: 128 files, {package.stat().st_size} bytes; SHA-256 {digest}')
          PY
      - name: Assert exact observed legacy release and tag inventory before deletion
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' v1.0.3 v1.0.4 v1.0.5 v1.0.6 v1.0.7 v1.0.8 v1.0.9 | LC_ALL=C sort)
          actual_releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' | LC_ALL=C sort)
          actual_tags=$(gh api --paginate "repos/$GH_REPO/git/refs/tags?per_page=100" --jq '.[].ref | sub("^refs/tags/"; "")' | LC_ALL=C sort)
          if [[ "$actual_releases" != "$expected" || "$actual_tags" != "$expected" ]]; then
            echo "Release/tag inventory changed; refusing destructive cleanup"
            printf 'Releases:\n%s\nTags:\n%s\n' "$actual_releases" "$actual_tags"
            exit 1
          fi
      - name: Create the sole official 1.5.0 release with one verified plugin
        shell: bash
        run: |
          set -euo pipefail
          target=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          gh release create '1.5.0' \
            'release-package/brendigo-sidrena-cijena-1.5.0.zip' \
            'release-package/brendigo-sidrena-cijena-1.5.0.zip.sha256' \
            --target "$target" \
            --title 'Brendigo Sidrena Cijena 1.5.0' \
            --notes 'Jedino službeno izdanje WordPress dodatka Brendigo Sidrena Cijena, sadržajno provjereno prema verziji 1.5.0 s WordPress.org i paketu vlasnika. Windows Desktop razvija se zasebno unutar repozitorija, bez dodatnih tagova.' \
            --latest
      - name: Delete only seven explicitly audited obsolete releases and tags
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.3 v1.0.4 v1.0.5 v1.0.6 v1.0.7 v1.0.8 v1.0.9; do
            echo "Deleting obsolete release/tag $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
      - name: Verify exactly one release and exactly one tag remain
        shell: bash
        run: |
          set -euo pipefail
          actual_releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' | LC_ALL=C sort)
          actual_tags=$(gh api --paginate "repos/$GH_REPO/git/refs/tags?per_page=100" --jq '.[].ref | sub("^refs/tags/"; "")' | LC_ALL=C sort)
          [[ "$actual_releases" == "1.5.0" ]] || { echo "Unexpected releases: $actual_releases"; exit 1; }
          [[ "$actual_tags" == "1.5.0" ]] || { echo "Unexpected tags: $actual_tags"; exit 1; }
          actual_assets=$(gh api "repos/$GH_REPO/releases/tags/1.5.0" --jq '.assets[].name' | LC_ALL=C sort)
          expected_assets=$(printf '%s\n' 'brendigo-sidrena-cijena-1.5.0.zip' 'brendigo-sidrena-cijena-1.5.0.zip.sha256' | LC_ALL=C sort)
          [[ "$actual_assets" == "$expected_assets" ]] || { echo "Unexpected release assets: $actual_assets"; exit 1; }
          gh release view '1.5.0' --json name,tagName,url,assets
