# Sidrena source file.
# Author: brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: Build Sidrena branded WordPress.org assets

on:
  workflow_dispatch:
  push:
    branches:
      - 'develop/**'
      - 'hotfix/**'
      - 'polish/**'
      - 'release-prep/**'
      - main
    paths:
      - 'admin/**'
      - 'assets/**'
      - 'branding/**'
      - '!branding/rendered/**'
      - 'includes/**'
      - 'languages/**'
      - 'public/**'
      - 'editions/**'
      - 'tools/capture-wporg-assets.mjs'
      - 'tools/runtime-rest-qa.mjs'
      - 'tools/install-wp-env.sh'
      - 'tools/run-plugin-check.sh'
      - '.github/tests/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: sidrena-wporg-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Capture real wp-admin screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Verify project metadata without mutating the review branch
        shell: bash
        run: python3 tools/apply-source-metadata.py --check

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install runtime tooling
        shell: bash
        run: |
          set -euo pipefail
          bash tools/install-wp-env.sh "$RUNNER_TEMP/sidrena-wp-env"
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          python3 -m pip install --disable-pip-version-check --quiet reportlab pillow
          sudo apt-get install -y -qq librsvg2-bin imagemagick poppler-utils

      - name: Build exact RC ZIPs and prepare runtime copies
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1 | tr -d '\r')"
          test -n "$VERSION"
          grep -Fq " * Version: $VERSION" editions/woocommerce/sidrena-woocommerce.php

          BUILD_DIR="$RUNNER_TEMP/sidrena-wporg-rc"
          rm -rf "$BUILD_DIR" .wp-env-runtime
          mkdir -p "$BUILD_DIR" .wp-env-runtime

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" ./tools/build-editions.sh "$VERSION" "$BUILD_DIR"

          (
            cd "$BUILD_DIR"
            sha256sum -c "sidrena-wordpress-$VERSION.zip.sha256"
            sha256sum -c "sidrena-woocommerce-$VERSION.zip.sha256"
          )
          unzip -t "$BUILD_DIR/sidrena-wordpress-$VERSION.zip" >/dev/null
          unzip -t "$BUILD_DIR/sidrena-woocommerce-$VERSION.zip" >/dev/null

          unzip -q "$BUILD_DIR/sidrena-wordpress-$VERSION.zip" -d .wp-env-runtime
          unzip -q "$BUILD_DIR/sidrena-woocommerce-$VERSION.zip" -d .wp-env-runtime

          test -f .wp-env-runtime/brendigo-sidrene-cijene-digitalni-cjenici/sidrena-wordpress.php
          test -f .wp-env-runtime/brendigo-sidrena-cijena/sidrena-woocommerce.php

          echo "SIDRENA_RC_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SIDRENA_RC_BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Capture Sidrena WordPress
        shell: bash
        run: |
          set -euo pipefail
          cat > .wp-env.json <<'JSON'
          {
            "plugins": ["./.wp-env-runtime/brendigo-sidrene-cijene-digitalni-cjenici"],
            "config": {
              "WP_DEBUG": false,
              "SCRIPT_DEBUG": false
            },
            "testsEnvironment": false
          }
          JSON

          wp-env start
          wp-env run cli wp plugin activate brendigo-sidrene-cijene-digitalni-cjenici
          SIDRENA_QA_EDITION=wordpress SIDRENA_RUNTIME_URL=http://localhost:8888 node tools/runtime-rest-qa.mjs

          rm -rf "$RUNNER_TEMP/sidrena-wordpress-assets"
          mkdir -p "$RUNNER_TEMP/sidrena-wordpress-assets"
          SIDRENA_SCREENSHOT_EDITION=wordpress \
          SIDRENA_SCREENSHOT_DIR="$RUNNER_TEMP/sidrena-wordpress-assets" \
          node tools/capture-wporg-assets.mjs

          printf 'y\n' | wp-env destroy

      - name: Capture Sidrena WooCommerce
        shell: bash
        run: |
          set -euo pipefail
          cat > .wp-env.json <<'JSON'
          {
            "mappings": {
              "wp-content/plugins/brendigo-sidrena-cijena": "./.wp-env-runtime/brendigo-sidrena-cijena"
            },
            "config": {
              "WP_DEBUG": false,
              "SCRIPT_DEBUG": false
            },
            "testsEnvironment": false
          }
          JSON

          wp-env start
          wp-env run cli wp plugin install woocommerce --activate
          wp-env run cli wp plugin activate brendigo-sidrena-cijena

          wp-env run cli wp eval '
          $controller = wc_get_container()->get( \Automattic\WooCommerce\Internal\Features\FeaturesController::class );
          $compat = $controller->get_compatible_features_for_plugin( "brendigo-sidrena-cijena/sidrena-woocommerce.php" );
          if ( ! in_array( "custom_order_tables", $compat["compatible"] ?? array(), true ) ) {
              fwrite( STDERR, "SIDRENA is not registered as HPOS compatible.\n" );
              exit( 1 );
          }
          echo "SIDRENA HPOS compatibility declaration recognized.\n";
          '

          wp-env run cli wp wc hpos enable --with-sync
          wp-env run cli wp eval '
          if ( ! \Automattic\WooCommerce\Utilities\OrderUtil::custom_orders_table_usage_is_enabled() ) {
              fwrite( STDERR, "HPOS did not become the authoritative WooCommerce order store.\n" );
              exit( 1 );
          }

          $product = new WC_Product_Simple();
          $product->set_name( "SIDRENA HPOS QA product" );
          $product->set_regular_price( "10.00" );
          $product_id = $product->save();
          if ( ! $product_id ) {
              fwrite( STDERR, "Unable to create HPOS QA product.\n" );
              exit( 1 );
          }

          $order = wc_create_order();
          $order->add_product( wc_get_product( $product_id ), 1 );
          $order->calculate_totals();
          $order_id = $order->save();
          $stored = wc_get_order( $order_id );
          if ( ! $order_id || ! $stored || count( $stored->get_items() ) !== 1 ) {
              fwrite( STDERR, "HPOS order CRUD failed with SIDRENA active.\n" );
              exit( 1 );
          }

          $stored->delete( true );
          wc_get_product( $product_id )->delete( true );
          echo "WooCommerce HPOS enabled and order CRUD passed with SIDRENA active.\n";
          '

          SIDRENA_QA_EDITION=woocommerce SIDRENA_RUNTIME_URL=http://localhost:8888 node tools/runtime-rest-qa.mjs

          rm -rf "$RUNNER_TEMP/sidrena-woocommerce-assets"
          mkdir -p "$RUNNER_TEMP/sidrena-woocommerce-assets"
          SIDRENA_SCREENSHOT_EDITION=woocommerce \
          SIDRENA_SCREENSHOT_DIR="$RUNNER_TEMP/sidrena-woocommerce-assets" \
          node tools/capture-wporg-assets.mjs

          printf 'y\n' | wp-env destroy

      - name: Build WordPress.org asset directories
        shell: bash
        run: |
          set -euo pipefail

          WP_ASSETS="wporg-assets/sidrena-wordpress/assets"
          WOO_ASSETS="wporg-assets/sidrena-woocommerce/assets"
          rm -rf "$WP_ASSETS" "$WOO_ASSETS"
          mkdir -p "$WP_ASSETS" "$WOO_ASSETS" docs/media

          cp "$RUNNER_TEMP/sidrena-wordpress-assets/"screenshot-*.png "$WP_ASSETS/"
          cp "$RUNNER_TEMP/sidrena-woocommerce-assets/"screenshot-*.png "$WOO_ASSETS/"

          cp "$WP_ASSETS/screenshot-1.png" docs/media/screenshot-wordpress.png
          cp "$WOO_ASSETS/screenshot-1.png" docs/media/screenshot-woocommerce.png
          for index in 1 2 3 4 5 6; do
            cp "$WP_ASSETS/screenshot-$index.png" "docs/media/screenshot-wordpress-$index.png"
            cp "$WOO_ASSETS/screenshot-$index.png" "docs/media/screenshot-woocommerce-$index.png"
          done

          rsvg-convert -w 128 -h 128 assets/images/app-icon.svg > "$WP_ASSETS/icon-128x128.png"
          rsvg-convert -w 256 -h 256 assets/images/app-icon.svg > "$WP_ASSETS/icon-256x256.png"
          cp assets/images/app-icon.svg "$WP_ASSETS/icon.svg"

          cp "$WP_ASSETS/icon-128x128.png" "$WOO_ASSETS/icon-128x128.png"
          cp "$WP_ASSETS/icon-256x256.png" "$WOO_ASSETS/icon-256x256.png"
          cp "$WP_ASSETS/icon.svg" "$WOO_ASSETS/icon.svg"

          rsvg-convert -w 772 -h 250 branding/wporg-banner-wordpress.svg > "$WP_ASSETS/banner-772x250.png"
          rsvg-convert -w 1544 -h 500 branding/wporg-banner-wordpress.svg > "$WP_ASSETS/banner-1544x500.png"
          rsvg-convert -w 772 -h 250 branding/wporg-banner-woocommerce.svg > "$WOO_ASSETS/banner-772x250.png"
          rsvg-convert -w 1544 -h 500 branding/wporg-banner-woocommerce.svg > "$WOO_ASSETS/banner-1544x500.png"

          identify "$WP_ASSETS/"*.png "$WOO_ASSETS/"*.png docs/media/screenshot-*.png
          test "$(identify -format '%wx%h' "$WP_ASSETS/icon-128x128.png")" = "128x128"
          test "$(identify -format '%wx%h' "$WP_ASSETS/icon-256x256.png")" = "256x256"
          test "$(identify -format '%wx%h' "$WP_ASSETS/banner-772x250.png")" = "772x250"
          test "$(identify -format '%wx%h' "$WP_ASSETS/banner-1544x500.png")" = "1544x500"

      - name: Render complete branding PNG set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding/rendered
          rsvg-convert -w 1600 -h 700 branding/website-hero-wordpress.svg > branding/rendered/website-hero-wordpress.png
          rsvg-convert -w 1600 -h 700 branding/website-hero-woocommerce.svg > branding/rendered/website-hero-woocommerce.png
          rsvg-convert -w 1200 -h 900 branding/plugin-cover-wordpress.svg > branding/rendered/plugin-cover-wordpress.png
          rsvg-convert -w 1200 -h 900 branding/plugin-cover-woocommerce.svg > branding/rendered/plugin-cover-woocommerce.png
          rsvg-convert -w 1400 -h 360 branding/email-header.svg > branding/rendered/email-header.png
          rsvg-convert -w 1200 -h 1600 branding/docs-cover-wordpress.svg > branding/rendered/docs-cover-wordpress.png
          rsvg-convert -w 1200 -h 1600 branding/docs-cover-woocommerce.svg > branding/rendered/docs-cover-woocommerce.png
          rsvg-convert -w 1600 -h 320 branding/cta-wordpress.svg > branding/rendered/cta-wordpress.png
          rsvg-convert -w 1600 -h 320 branding/cta-woocommerce.svg > branding/rendered/cta-woocommerce.png
          rsvg-convert -w 920 -h 560 branding/app-card-wordpress.svg > branding/rendered/app-card-wordpress.png
          rsvg-convert -w 920 -h 560 branding/app-card-woocommerce.svg > branding/rendered/app-card-woocommerce.png
          rsvg-convert -w 1100 -h 380 branding/compact-wordpress.svg > branding/rendered/compact-wordpress.png
          rsvg-convert -w 1100 -h 380 branding/compact-woocommerce.svg > branding/rendered/compact-woocommerce.png
          rsvg-convert -w 1080 -h 1080 branding/social-wordpress.svg > branding/rendered/social-wordpress.png
          rsvg-convert -w 1080 -h 1080 branding/social-woocommerce.svg > branding/rendered/social-woocommerce.png
          rsvg-convert -w 1544 -h 500 branding/wporg-banner-wordpress.svg > branding/rendered/wporg-banner-wordpress.png
          rsvg-convert -w 1544 -h 500 branding/wporg-banner-woocommerce.svg > branding/rendered/wporg-banner-woocommerce.png
          rsvg-convert -w 1200 -h 1600 branding/support-cover.svg > branding/rendered/support-cover.png
          identify branding/rendered/*.png

      - name: Upload generated assets
        uses: actions/upload-artifact@v7
        with:
          name: sidrena-real-wordpress-org-assets-${{ github.sha }}
          path: |
            wporg-assets/
            docs/media/screenshot-wordpress.png
            docs/media/screenshot-woocommerce.png
            docs/media/screenshot-wordpress-*.png
            docs/media/screenshot-woocommerce-*.png
            branding/rendered/
          if-no-files-found: error

      - name: Keep generated assets immutable during review
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated WordPress.org assets are uploaded as workflow artifacts."
          echo "The review branch is never auto-committed or rebased by this workflow."
