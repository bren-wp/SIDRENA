name: Sidrena distribution guard

on:
  push:
    branches:
      - main
      - 'develop/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'develop/**'

permissions:
  contents: read

jobs:
  distribution:
    name: Source and ZIP distribution shape
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PDF build dependency
        run: python3 -m pip install --disable-pip-version-check --quiet reportlab

      - name: Guard source tree edition boundaries
        shell: bash
        run: |
          set -euo pipefail

          test -d editions/wordpress
          test -d editions/woocommerce
          test -f editions/wordpress/sidrena-wordpress.php
          test -f editions/woocommerce/sidrena-woocommerce.php
          test -f editions/wordpress/readme.txt
          test -f editions/woocommerce/readme.txt

          test ! -f sidrena.php
          test ! -d static-php
          test ! -d editions/static-php
          test ! -d editions/generic
          test ! -d windows
          test ! -f .github/workflows/windows-release-assets.yml
          test ! -f .github/workflows/windows-app-guard.yml

          find editions -maxdepth 2 -type f -name 'sidrena-*.php' | sort > "$RUNNER_TEMP/sidrena-edition-entrypoints.txt"
          cat > "$RUNNER_TEMP/sidrena-expected-entrypoints.txt" <<'EOF'
          editions/woocommerce/sidrena-woocommerce.php
          editions/wordpress/sidrena-wordpress.php
          EOF
          diff -u "$RUNNER_TEMP/sidrena-expected-entrypoints.txt" "$RUNNER_TEMP/sidrena-edition-entrypoints.txt"

          if find . -path './.git' -prune -o -type f -name 'sidrena.php' -print | grep -q .; then
            echo 'Generic root sidrena.php entrypoint detected.' >&2
            exit 1
          fi

          if find . -path './.git' -prune -o -type f \( -iname 'portable.exe' -o -iname 'setup.exe' -o -iname '*.msi' -o -iname '*.appx' -o -iname '*.pdb' \) -print | grep -q .; then
            echo 'Retired Windows/setup/debug artifact detected in source tree.' >&2
            exit 1
          fi

      - name: WordPress.org readability and safety guard
        shell: bash
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' \) -print | xargs grep -nE '(^|[^a-zA-Z0-9_])(eval|base64_decode|gzinflate|str_rot13|shell_exec|passthru|proc_open|popen|assert)\s*\(' ; then
            echo 'WordPress.org review guard: dangerous or obfuscation-prone primitive detected.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          checked_suffixes = {'.php', '.js', '.css'}
          violations = []
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file() or path.suffix not in checked_suffixes:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for number, line in enumerate(text.splitlines(), start=1):
                  if len(line) > 1000:
                      violations.append(f'{path}:{number}: line longer than 1000 characters')
              if path.suffix in {'.js', '.css'} and text.count('\n') < 3 and len(text) > 400:
                  violations.append(f'{path}: appears minified or not human-readable')
          if violations:
              print('\n'.join(violations))
              raise SystemExit(1)
          PY

      - name: Build and verify only two installable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1)"
          WOO_VERSION="$(sed -n 's/^ \* Version: //p' editions/woocommerce/sidrena-woocommerce.php | head -n1)"
          test -n "$VERSION"
          test "$VERSION" = "$WOO_VERSION"

          OUT="$RUNNER_TEMP/sidrena-distribution"
          mkdir -p "$OUT"
          ./tools/build-editions.sh "$VERSION" "$OUT"

          find "$OUT" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort > "$RUNNER_TEMP/sidrena-zip-assets.txt"
          cat > "$RUNNER_TEMP/sidrena-expected-zip-assets.txt" <<EOF
          sidrena-woocommerce-$VERSION.zip
          sidrena-wordpress-$VERSION.zip
          EOF
          diff -u "$RUNNER_TEMP/sidrena-expected-zip-assets.txt" "$RUNNER_TEMP/sidrena-zip-assets.txt"

          WP_ZIP="$OUT/sidrena-wordpress-$VERSION.zip"
          WOO_ZIP="$OUT/sidrena-woocommerce-$VERSION.zip"
          test -s "$WP_ZIP"
          test -s "$WOO_ZIP"

          zipinfo -1 "$WP_ZIP" > "$RUNNER_TEMP/sidrena-wordpress-files.txt"
          zipinfo -1 "$WOO_ZIP" > "$RUNNER_TEMP/sidrena-woocommerce-files.txt"

          grep -q '^sidrena-wordpress/sidrena-wordpress.php$' "$RUNNER_TEMP/sidrena-wordpress-files.txt"
          grep -q '^sidrena-woocommerce/sidrena-woocommerce.php$' "$RUNNER_TEMP/sidrena-woocommerce-files.txt"
          ! grep -q '^sidrena-wordpress/sidrena.php$' "$RUNNER_TEMP/sidrena-wordpress-files.txt"
          ! grep -q '^sidrena-woocommerce/sidrena.php$' "$RUNNER_TEMP/sidrena-woocommerce-files.txt"
          ! grep -q '^sidrena-wordpress/editions/' "$RUNNER_TEMP/sidrena-wordpress-files.txt"
          ! grep -q '^sidrena-woocommerce/editions/' "$RUNNER_TEMP/sidrena-woocommerce-files.txt"
          ! grep -q '/static-php/' "$RUNNER_TEMP/sidrena-wordpress-files.txt"
          ! grep -q '/static-php/' "$RUNNER_TEMP/sidrena-woocommerce-files.txt"

          for files in "$RUNNER_TEMP/sidrena-wordpress-files.txt" "$RUNNER_TEMP/sidrena-woocommerce-files.txt"; do
            ! grep -Eiq '(^|/)(portable|setup)\.exe$' "$files"
            ! grep -Eiq '(^|/)windows/' "$files"
            ! grep -Eiq '\.(exe|msi|appx|pdb|map)$' "$files"
            ! grep -Eiq '^sidrena-[^/]+/(\.github|tools|editions|docs/media)/' "$files"
          done

          if grep -v '^sidrena-wordpress/' "$RUNNER_TEMP/sidrena-wordpress-files.txt"; then
            echo 'WordPress ZIP contains files outside sidrena-wordpress root.' >&2
            exit 1
          fi
          if grep -v '^sidrena-woocommerce/' "$RUNNER_TEMP/sidrena-woocommerce-files.txt"; then
            echo 'WooCommerce ZIP contains files outside sidrena-woocommerce root.' >&2
            exit 1
          fi
