# Sidrena source file.
# Author: brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: Sidrena distribution guard

on:
  push:
    branches:
      - main
      - 'develop/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'develop/**'

permissions:
  contents: read

jobs:
  distribution:
    name: Source and ZIP distribution shape
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PDF build and render dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet reportlab pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Guard source tree edition boundaries
        shell: bash
        run: |
          set -euo pipefail

          test -d editions/wordpress
          test -d editions/woocommerce
          test -f editions/wordpress/brendigo-sidrene-cijene-digitalni-cjenici.php
          test -f editions/woocommerce/brendigo-sidrene-cijene-cjenici.php
          test -f editions/wordpress/readme.txt
          test -f editions/woocommerce/readme.txt

          test ! -f sidrena.php
          test ! -d static-php
          test ! -d editions/static-php
          test ! -d editions/generic
          test ! -d windows
          test ! -f .github/workflows/windows-release-assets.yml
          test ! -f .github/workflows/windows-app-guard.yml

          find editions -maxdepth 2 -type f -name 'sidrena-*.php' | sort > "$RUNNER_TEMP/sidrena-edition-entrypoints.txt"
          cat > "$RUNNER_TEMP/sidrena-expected-entrypoints.txt" <<'EOF'
          editions/woocommerce/brendigo-sidrene-cijene-cjenici.php
          editions/wordpress/brendigo-sidrene-cijene-digitalni-cjenici.php
          EOF
          diff -u "$RUNNER_TEMP/sidrena-expected-entrypoints.txt" "$RUNNER_TEMP/sidrena-edition-entrypoints.txt"

          if find . -path './.git' -prune -o -type f -name 'sidrena.php' -print | grep -q .; then
            echo 'Generic root sidrena.php entrypoint detected.' >&2
            exit 1
          fi

          if find . -path './.git' -prune -o -type f \( -iname 'portable.exe' -o -iname 'setup.exe' -o -iname '*.msi' -o -iname '*.appx' -o -iname '*.pdb' \) -print | grep -q .; then
            echo 'Retired Windows/setup/debug artifact detected in source tree.' >&2
            exit 1
          fi

      - name: Verify documentation and local branding assets
        shell: bash
        run: |
          if grep -RInE 'Cjenikomat|cjenikomat' assets branding wporg-assets editions includes docs tools --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.pdf'; then
            echo 'Retired Cjenikomat branding detected; SIDRENA must remain the runtime and visual brand.' >&2
            exit 1
          fi
          set -euo pipefail
          test -s assets/images/menu-anchor.svg
          test -s assets/images/logo-mark.svg
          test -s assets/images/app-icon.svg
          test -s assets/images/logo-horizontal-light.svg
          test -s assets/images/logo-brendigo-standalone.svg
          test -s assets/images/logo-brendigo-standalone-light.svg
          test -s assets/images/logo-brendigo-store.svg
          test -s assets/images/logo-brendigo-store-light.svg
          test -s assets/images/brand-hero.svg
          test -s admin/css/brand.css
          test -s branding/BRAND-GUIDE.md
          test -s branding/website-hero-wordpress.svg
          test -s branding/website-hero-woocommerce.svg
          test -s docs/media/screenshot-wordpress.png
          test -s docs/media/screenshot-woocommerce.png

          if grep -Ini 'WooCommerce' \
            assets/images/logo-brendigo-store.svg \
            assets/images/logo-brendigo-store-light.svg \
            branding/app-card-woocommerce.svg \
            branding/compact-woocommerce.svg \
            branding/cta-woocommerce.svg \
            branding/docs-cover-woocommerce.svg \
            branding/plugin-cover-woocommerce.svg \
            branding/social-woocommerce.svg \
            branding/website-hero-woocommerce.svg \
            branding/wporg-banner-woocommerce.svg; then
            echo 'Third-party WooCommerce wording must not appear inside SIDRENA graphic assets.' >&2
            exit 1
          fi

          grep -Fq "plugins_url( 'assets/images/menu-anchor.svg', SIDRENA_FILE )" includes/class-sidrena-admin-menu.php
          grep -Fq "SIDRENA_URL . 'assets/images/logo-horizontal-light.svg'" includes/class-sidrena-admin.php
          grep -Fq "sidrena-brandbar__edition" includes/class-sidrena-admin.php
          grep -Fq "plugins_url( 'admin/css/brand.css', SIDRENA_FILE )" includes/class-sidrena-admin.php
          ! grep -Fq "admin/css/admin-160.css" includes/class-sidrena-admin.php

          test -s wporg-assets/sidrena-wordpress/assets/icon-128x128.png
          test -s wporg-assets/sidrena-wordpress/assets/icon-256x256.png
          test -s wporg-assets/sidrena-wordpress/assets/banner-772x250.png
          test -s wporg-assets/sidrena-wordpress/assets/banner-1544x500.png
          for index in 1 2 3 4 5 6; do
            test -s "wporg-assets/sidrena-wordpress/assets/screenshot-$index.png"
          done

          test -s wporg-assets/sidrena-woocommerce/assets/icon-128x128.png
          test -s wporg-assets/sidrena-woocommerce/assets/icon-256x256.png
          test -s wporg-assets/sidrena-woocommerce/assets/banner-772x250.png
          test -s wporg-assets/sidrena-woocommerce/assets/banner-1544x500.png
          for index in 1 2 3 4 5 6; do
            test -s "wporg-assets/sidrena-woocommerce/assets/screenshot-$index.png"
          done

      - name: WordPress.org readability and safety guard
        shell: bash
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' \) -print | xargs grep -nE '(^|[^a-zA-Z0-9_])(eval|base64_decode|gzinflate|str_rot13|shell_exec|passthru|proc_open|popen|assert)\s*\(' ; then
            echo 'WordPress.org review guard: dangerous or obfuscation-prone primitive detected.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          checked_suffixes = {'.php', '.js', '.css'}
          violations = []
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file() or path.suffix not in checked_suffixes:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for number, line in enumerate(text.splitlines(), start=1):
                  if len(line) > 3200:
                      violations.append(f'{path}:{number}: line longer than 3200 characters')
              if path.suffix in {'.js', '.css'} and text.count('\n') < 3 and len(text) > 400:
                  violations.append(f'{path}: appears minified or not human-readable')
          if violations:
              print('\n'.join(violations))
              raise SystemExit(1)
          PY

      - name: Build and verify only two lightweight installable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/brendigo-sidrene-cijene-digitalni-cjenici.php | head -n1)"
          WOO_VERSION="$(sed -n 's/^ \* Version: //p' editions/woocommerce/brendigo-sidrene-cijene-cjenici.php | head -n1)"
          test -n "$VERSION"
          test "$VERSION" = "$WOO_VERSION"

          OUT="$RUNNER_TEMP/sidrena-distribution"
          mkdir -p "$OUT"
          ./tools/build-editions.sh "$VERSION" "$OUT"

          find "$OUT" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort > "$RUNNER_TEMP/sidrena-zip-assets.txt"
          cat > "$RUNNER_TEMP/sidrena-expected-zip-assets.txt" <<EOF
          brendigo-sidrene-cijene-cjenici-$VERSION.zip
          brendigo-sidrene-cijene-digitalni-cjenici-$VERSION.zip
          EOF
          diff -u "$RUNNER_TEMP/sidrena-expected-zip-assets.txt" "$RUNNER_TEMP/sidrena-zip-assets.txt"

          WP_ZIP="$OUT/brendigo-sidrene-cijene-digitalni-cjenici-$VERSION.zip"
          WOO_ZIP="$OUT/brendigo-sidrene-cijene-cjenici-$VERSION.zip"
          for ZIP in "$WP_ZIP" "$WOO_ZIP"; do
            test -s "$ZIP"
            SIZE="$(stat -c%s "$ZIP")"
            echo "$(basename "$ZIP"): $SIZE bytes"
            test "$SIZE" -le 1572864
          done

          (
            cd "$OUT"
            sha256sum -c "brendigo-sidrene-cijene-digitalni-cjenici-$VERSION.zip.sha256"
            sha256sum -c "brendigo-sidrene-cijene-cjenici-$VERSION.zip.sha256"
          )
          unzip -t "$WP_ZIP" >/dev/null
          unzip -t "$WOO_ZIP" >/dev/null

          zipinfo -1 "$WP_ZIP" > "$RUNNER_TEMP/brendigo-standalone-files.txt"
          zipinfo -1 "$WOO_ZIP" > "$RUNNER_TEMP/brendigo-store-files.txt"

          grep -Fxq 'brendigo-sidrene-cijene-digitalni-cjenici/brendigo-sidrene-cijene-digitalni-cjenici.php' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-cjenici/brendigo-sidrene-cijene-cjenici.php' "$RUNNER_TEMP/brendigo-store-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-digitalni-cjenici/docs/UPUTE.md' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-cjenici/docs/UPUTE.md' "$RUNNER_TEMP/brendigo-store-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-digitalni-cjenici/docs/SIDRENA-UPUTE.pdf' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-cjenici/docs/SIDRENA-UPUTE.pdf' "$RUNNER_TEMP/brendigo-store-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-digitalni-cjenici/assets/images/menu-anchor.svg' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-cjenici/assets/images/menu-anchor.svg' "$RUNNER_TEMP/brendigo-store-files.txt"
          grep -Fxq 'sidrena-wordpress/assets/images/logo-brendigo-standalone.svg' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'sidrena-woocommerce/assets/images/logo-brendigo-store.svg' "$RUNNER_TEMP/brendigo-store-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-digitalni-cjenici/admin/css/brand.css' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-cjenici/admin/css/brand.css' "$RUNNER_TEMP/brendigo-store-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-digitalni-cjenici/admin/js/admin.js' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'brendigo-sidrene-cijene-cjenici/admin/js/admin.js' "$RUNNER_TEMP/brendigo-store-files.txt"
          grep -Fxq 'sidrena-wordpress/assets/images/logo-brendigo-standalone-light.svg' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          grep -Fxq 'sidrena-woocommerce/assets/images/logo-brendigo-store-light.svg' "$RUNNER_TEMP/brendigo-store-files.txt"

          for asset in \
            assets/images/logo-horizontal.svg \
            assets/images/logo-horizontal-light.svg \
            assets/images/logo-mark.svg \
            assets/images/app-icon.svg \
            assets/images/favicon.svg \
            assets/images/menu-anchor.svg \
            assets/images/brand-hero.svg \
            includes/class-sidrena-audit.php \
            includes/class-sidrena-pricelist.php; do
            grep -Fxq "brendigo-sidrene-cijene-digitalni-cjenici/$asset" "$RUNNER_TEMP/brendigo-standalone-files.txt"
            grep -Fxq "brendigo-sidrene-cijene-cjenici/$asset" "$RUNNER_TEMP/brendigo-store-files.txt"
          done

          grep -Fq "private static function cut_utf8_bytes" "$OUT/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici/includes/class-sidrena-audit.php"
          grep -Fq "private static function cut_utf8_bytes" "$OUT/.sidrena-build/brendigo-sidrene-cijene-cjenici/includes/class-sidrena-audit.php"
          grep -Fq "open_atomic_writer( \$paths['manifest'] )" "$OUT/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici/includes/class-sidrena-pricelist.php"
          grep -Fq "open_atomic_writer( \$paths['manifest'] )" "$OUT/.sidrena-build/brendigo-sidrene-cijene-cjenici/includes/class-sidrena-pricelist.php"

          ! grep -q '^brendigo-sidrene-cijene-digitalni-cjenici/branding/' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          ! grep -q '^brendigo-sidrene-cijene-cjenici/branding/' "$RUNNER_TEMP/brendigo-store-files.txt"
          ! grep -q '^brendigo-sidrene-cijene-digitalni-cjenici/docs/images/' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          ! grep -q '^brendigo-sidrene-cijene-cjenici/docs/images/' "$RUNNER_TEMP/brendigo-store-files.txt"
          ! grep -q '^brendigo-sidrene-cijene-digitalni-cjenici/assets/images/logo-woocommerce' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          ! grep -q '^brendigo-sidrene-cijene-cjenici/assets/images/logo-wordpress' "$RUNNER_TEMP/brendigo-store-files.txt"
          ! grep -Fxq 'brendigo-sidrene-cijene-digitalni-cjenici/sidrena.php' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          ! grep -Fxq 'brendigo-sidrene-cijene-cjenici/sidrena.php' "$RUNNER_TEMP/brendigo-store-files.txt"
          ! grep -q '^brendigo-sidrene-cijene-digitalni-cjenici/editions/' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          ! grep -q '^brendigo-sidrene-cijene-cjenici/editions/' "$RUNNER_TEMP/brendigo-store-files.txt"
          ! grep -q '/static-php/' "$RUNNER_TEMP/brendigo-standalone-files.txt"
          ! grep -q '/static-php/' "$RUNNER_TEMP/brendigo-store-files.txt"

          WP="$OUT/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici"
          WOO="$OUT/.sidrena-build/brendigo-sidrene-cijene-cjenici"
          grep -Fq 'Text Domain: brendigo-sidrene-cijene-digitalni-cjenici' "$WP/brendigo-sidrene-cijene-digitalni-cjenici.php"
          grep -Fq 'Text Domain: brendigo-sidrene-cijene-cjenici' "$WOO/brendigo-sidrene-cijene-cjenici.php"
          test -f "$WP/languages/brendigo-sidrene-cijene-digitalni-cjenici.pot"
          test -f "$WOO/languages/brendigo-sidrene-cijene-cjenici.pot"
          test ! -f "$WP/languages/sidrena-wordpress.pot"
          test ! -f "$WOO/languages/sidrena-woocommerce.pot"
          grep -Fq 'X-Domain: brendigo-sidrene-cijene-digitalni-cjenici' "$WP/languages/brendigo-sidrene-cijene-digitalni-cjenici.pot"
          grep -Fq 'X-Domain: brendigo-sidrene-cijene-cjenici' "$WOO/languages/brendigo-sidrene-cijene-cjenici.pot"
          grep -Fq 'License: GPLv2 or later' "$WP/brendigo-sidrene-cijene-digitalni-cjenici.php"
          grep -Fq 'License: GPLv2 or later' "$WOO/brendigo-sidrene-cijene-cjenici.php"
          ! grep -RInF 'https://sidrene-cijene.com.hr/' "$WP" "$WOO"

          for files in "$RUNNER_TEMP/brendigo-standalone-files.txt" "$RUNNER_TEMP/brendigo-store-files.txt"; do
            ! grep -Eiq '(^|/)(portable|setup)[.]exe' "$files"
            ! grep -Eiq '(^|/)windows/' "$files"
            ! grep -Eiq '[.](exe|msi|appx|pdb|map)' "$files"
            ! grep -Eiq '^sidrena-[^/]+/(\.github|tools|editions|docs/media)/' "$files"
          done

          if grep -v '^brendigo-sidrene-cijene-digitalni-cjenici/' "$RUNNER_TEMP/brendigo-standalone-files.txt"; then
            echo 'WordPress ZIP contains files outside sidrena-wordpress root.' >&2
            exit 1
          fi
          if grep -v '^brendigo-sidrene-cijene-cjenici/' "$RUNNER_TEMP/brendigo-store-files.txt"; then
            echo 'WooCommerce ZIP contains files outside sidrena-woocommerce root.' >&2
            exit 1
          fi

      - name: Render and validate detailed PDF manuals
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sidrena-distribution"
          RENDER="$RUNNER_TEMP/sidrena-pdf-visual-qa"
          rm -rf "$RENDER"
          mkdir -p "$RENDER"

          python3 tools/pdf-visual-qa.py \
            --pdf "$OUT/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici/docs/SIDRENA-UPUTE.pdf" \
            --output-dir "$RENDER/wordpress" \
            --label "SIDRENA WordPress"

          python3 tools/pdf-visual-qa.py \
            --pdf "$OUT/.sidrena-build/brendigo-sidrene-cijene-cjenici/docs/SIDRENA-UPUTE.pdf" \
            --output-dir "$RENDER/woocommerce" \
            --label "SIDRENA WooCommerce"

      - name: Upload PDF visual QA renders
        uses: actions/upload-artifact@v7
        with:
          name: sidrena-pdf-visual-qa
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/sidrena-pdf-visual-qa/
      - name: Upload verified review packages
        uses: actions/upload-artifact@v7
        with:
          name: sidrena-wordpress-org-review
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/sidrena-distribution/brendigo-sidrene-cijene-digitalni-cjenici-*.zip
            ${{ runner.temp }}/sidrena-distribution/brendigo-sidrene-cijene-cjenici-*.zip
            ${{ runner.temp }}/sidrena-distribution/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici/docs/SIDRENA-UPUTE.pdf
            ${{ runner.temp }}/sidrena-distribution/.sidrena-build/brendigo-sidrene-cijene-cjenici/docs/SIDRENA-UPUTE.pdf
