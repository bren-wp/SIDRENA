name: Adopt official Brendigo Sidrena Cijena
on:
  push:
    branches:
      - feature/official-brendigo-plugin-only-and-desktop
    paths:
      - '.github/workflows/adopt-official-plugin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download original official package from WordPress.org
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://downloads.wordpress.org/plugin/brendigo-sidrena-cijena.1.5.0.zip \
            --output /tmp/brendigo-sidrena-cijena-1.5.0.zip
      - name: Verify against user-supplied package and migrate repository
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import shutil
          import zipfile
          root=pathlib.Path.cwd()
          archive=zipfile.ZipFile('/tmp/brendigo-sidrena-cijena-1.5.0.zip')
          prefix='brendigo-sidrena-cijena/'
          files={}
          for info in archive.infolist():
              if info.is_dir():
                  continue
              if not info.filename.startswith(prefix):
                  raise RuntimeError('Unexpected ZIP prefix')
              relative=info.filename[len(prefix):]
              path=pathlib.PurePosixPath(relative)
              if not relative or path.is_absolute() or '..' in path.parts or '\\' in relative:
                  raise RuntimeError('Unsafe ZIP path')
              if relative in files or info.file_size>2000000:
                  raise RuntimeError('Duplicate/oversized file')
              files[relative]=archive.read(info)
          manifest=''.join(f'{p} {hashlib.sha256(files[p]).hexdigest()}\n' for p in sorted(files))
          digest=hashlib.sha256(manifest.encode()).hexdigest()
          assert len(files)==128, 'Wrong number of WordPress plugin files'
          assert digest=='44b6ff17478f7769d9bda8157020269247f9dad2c186d92b82ddfbd21e996387', 'Package differs from user-uploaded plugin 1.5.0; abort without deleting'
          assert b'Version: 1.5.0' in files['brendigo-sidrena-cijena.php']
          # No mutation occurs before all supplied-archive checks pass.
          old=['admin','assets','branding','editions','includes','languages','public','wporg-assets','.github/tests']
          for folder in old:
              path=root/folder
              if path.is_dir():shutil.rmtree(path)
          for file in ['changelog.txt','uninstall.php','phpcs.xml.dist','phpstan.neon.dist']:
              (root/file).unlink(missing_ok=True)
          allowed={'desktop-ci.yml','adopt-official-plugin.yml','official-plugin-ci.yml'}
          for path in (root/'.github/workflows').glob('*.yml'):
              if path.name not in allowed:path.unlink()
          for path in (root/'tools').glob('*'):
              if path.is_file():path.unlink()
          for path in (root/'docs').rglob('*'):
              if path.is_file() and path.name!='DESKTOP-UI-PARITY.md':path.unlink()
          target=root/'wordpress/brendigo-sidrena-cijena'
          if target.is_dir():shutil.rmtree(target)
          for name,data in files.items():
              path=target/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          assert (root/'desktop/Sidrena.Desktop').is_dir()
          print('Exact owner-provided version 1.5.0 verified and adopted:',len(files),'files SHA256:',digest)
          PY
      - name: Commit plugin replacement on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(repo): retain only official Brendigo plugin and Windows desktop'
          git push origin HEAD:refs/heads/feature/official-brendigo-plugin-only-and-desktop
