name: Apply Sidrena source metadata

on:
  push:
    branches:
      - develop/0.1.0
    paths:
      - '.github/workflows/apply-source-metadata.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: develop/0.1.0

      - name: Apply metadata
        run: python3 tools/apply-source-metadata.py

      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: standardize Sidrena source metadata"
          git push origin HEAD:develop/0.1.0
