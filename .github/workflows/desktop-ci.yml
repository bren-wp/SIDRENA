# Sidrena source file.
# Author: brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: SIDRENA Desktop build and smoke test

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build, local-data smoke, portable package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Windows app
        run: dotnet restore desktop/Sidrena.Desktop/Sidrena.Desktop.csproj
      - name: Build Windows app
        run: dotnet build desktop/Sidrena.Desktop/Sidrena.Desktop.csproj -c Release --no-restore
      - name: Run independent local catalogue smoke tests
        run: dotnet run --project desktop/Sidrena.Tests/Sidrena.Tests.csproj -c Release
      - name: Publish portable Windows x64 app
        run: >
          dotnet publish desktop/Sidrena.Desktop/Sidrena.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/sidrena-desktop-win-x64
      - name: Verify portable executable
        shell: pwsh
        run: |
          $exe = 'artifacts/sidrena-desktop-win-x64/SIDRENA.exe'
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          if ((Get-Item $exe).Length -lt 100000) { throw 'Portable executable unexpectedly small' }
      - name: Portable executable startup smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/sidrena-desktop-win-x64/SIDRENA.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $db = Join-Path $env:LOCALAPPDATA 'Brendigo/SIDRENA/sidrena.db'
            $initialized = $false
            for ($attempt = 1; $attempt -le 35; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { throw "SIDRENA exited during startup (exit code $($process.ExitCode))." }
              if (Test-Path $db) { $initialized = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$initialized) { throw "SIDRENA stayed open but did not initialize the local catalogue within 35 seconds ($db)." }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Navigate through all ten reference screens
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/sidrena-desktop-win-x64/SIDRENA.exe').Path
          $marker = Join-Path $env:LOCALAPPDATA 'Brendigo/SIDRENA/ui-smoke.ok'
          if (Test-Path $marker) { Remove-Item $marker -Force }
          $env:SIDRENA_UI_SMOKE = '1'
          $app = Start-Process -FilePath $exe -PassThru
          try {
            $app | Wait-Process -Timeout 90 -ErrorAction Stop
            $app.Refresh()
            if ($app.ExitCode -ne 0) { throw "UI navigation failed with exit code $($app.ExitCode)." }
            if (!(Test-Path $marker)) { throw 'Missing ten-screen navigation marker' }
            $result = Get-Content $marker -Raw
            if (!$result.Contains('10/10 passed')) { throw $result }
            Write-Output $result
          } finally {
            Remove-Item Env:SIDRENA_UI_SMOKE -ErrorAction SilentlyContinue
            $app.Refresh()
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Verify all ten real Windows reference captures
        shell: pwsh
        run: |
          $folder = Join-Path $env:LOCALAPPDATA 'Brendigo/SIDRENA/ui-captures'
          $screens = @(Get-ChildItem -Path $folder -Filter 'screen-*.png' -File)
          if ($screens.Count -ne 10) { throw "Expected 10 real WPF screenshots, got $($screens.Count)." }
          foreach ($s in $screens) {
            if ($s.Length -lt 1000) { throw "UI capture $($s.Name) is unexpectedly small." }
          }
          New-Item -ItemType Directory -Force -Path artifacts/sidrena-ui-captures | Out-Null
          Copy-Item -Path (Join-Path $folder '*.png') -Destination artifacts/sidrena-ui-captures/
          $responsive = Join-Path $env:LOCALAPPDATA 'Brendigo/SIDRENA/ui-captures-responsive'
          $adapted = @(Get-ChildItem -Path $responsive -Filter '*-screen-*.png' -File)
          if ($adapted.Count -ne 20) { throw "Expected 20 responsive WPF screenshots, got $($adapted.Count)." }
          foreach($file in $adapted) {
            if ($file.Length -lt 1000) { throw "Responsive capture $($file.Name) is unexpectedly small." }
          }
          New-Item -ItemType Directory -Force -Path artifacts/sidrena-ui-captures/responsive | Out-Null
          Copy-Item -Path (Join-Path $responsive '*.png') -Destination artifacts/sidrena-ui-captures/responsive/
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Missing Inno Setup compiler: $compiler" }
          "ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Compile actual Windows Setup EXE
        shell: pwsh
        run: |
          & $env:ISCC desktop/installer/SIDRENA.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed ($LASTEXITCODE)" }
          $exe='artifacts/desktop-release/SIDRENA-Desktop-win-x64-Setup.exe'
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 100000) { throw "Setup executable missing or too small" }
      - name: Test silent setup, installed application and user data preservation
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'artifacts/desktop-release/SIDRENA-Desktop-win-x64-Setup.exe').Path
          $result=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "Silent setup failed: $($result.ExitCode)" }
          $dir=Join-Path $env:LOCALAPPDATA 'Programs\Brendigo\SIDRENA'
          $installed=Join-Path $dir 'SIDRENA.exe'
          if (!(Test-Path $installed)) { throw 'Setup did not install SIDRENA.exe' }
          $app=Start-Process -FilePath $installed -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw 'Installed application exited unexpectedly' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          $uninstaller=Join-Path $dir 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Installer did not register an uninstaller' }
          $done=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($done.ExitCode -ne 0) { throw "Uninstall failed ($($done.ExitCode))" }
          if (!(Test-Path (Join-Path $env:LOCALAPPDATA 'Brendigo\SIDRENA\sidrena.db'))) {
            throw 'Uninstaller removed the user SQLite database'
          }
      - name: Stage portable EXE, setup EXE and SHA-256 manifests
        shell: pwsh
        run: |
          $folder='artifacts/desktop-release'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $portable=Join-Path $folder 'SIDRENA-Desktop-win-x64-Portable.exe'
          Copy-Item 'artifacts/sidrena-desktop-win-x64/SIDRENA.exe' -Destination $portable
          $setup=Join-Path $folder 'SIDRENA-Desktop-win-x64-Setup.exe'
          $files=@($portable,$setup)
          $checks=@()
          $manifestFiles=@()
          foreach($p in $files) {
            $hash=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            $checks+= "$hash  $(Split-Path $p -Leaf)"
            $manifestFiles+= [pscustomobject]@{
              filename=(Split-Path $p -Leaf)
              size=(Get-Item $p).Length
              sha256=$hash
            }
          }
          $checks | Set-Content (Join-Path $folder 'SIDRENA-Desktop-win-x64-SHA256SUMS.txt') -Encoding utf8
          $manifest=[ordered]@{
            product='SIDRENA Desktop'
            desktop_version='0.7.0'
            wordpress_plugin_version='1.5.0'
            platform='Windows x64'
            source_commit=$env:GITHUB_SHA
            digitally_signed=$false
            files=$manifestFiles
          }
          $manifest | ConvertTo-Json -Depth 8 |
            Set-Content (Join-Path $folder 'SIDRENA-Desktop-release-info.json') -Encoding utf8
          foreach($p in $files) {
            if((Get-Item $p).Length -lt 100000) { throw "Binary too small: $p" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: SIDRENA-Desktop-release-binaries
          path: artifacts/desktop-release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: SIDRENA-Desktop-real-ui-captures
          path: artifacts/sidrena-ui-captures/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: SIDRENA-Desktop-win-x64-portable
          path: artifacts/sidrena-desktop-win-x64/
          if-no-files-found: error
          retention-days: 14
