name: Remove retired Static PHP release assets

on:
  push:
    branches:
      - develop/2.0.0
    paths:
      - '.github/workflows/cleanup-retired-static.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove retired v1.7.0 Static assets and wording
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/releases/tags/v1.7.0"
          RELEASE_JSON="$(gh api "$API")"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"

          for NAME in             sidrena-static-php-1.7.0.zip             sidrena-static-php-1.7.0.zip.sha256
          do
            ASSET_ID="$(jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .id' <<<"$RELEASE_JSON" | head -n1)"
            if [[ -n "$ASSET_ID" && "$ASSET_ID" != "null" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
            fi
          done

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"             -f body='## Sidrena 1.7.0

Legacy release retained for existing installations.

For current supported distributions use the latest Sidrena release:
- Sidrena WordPress for WordPress sites without WooCommerce.
- Sidrena WooCommerce for WooCommerce stores.

Official site: https://sidrene-cijene.com.hr/'

          REMAINING="$(gh api "$API" --jq '.assets[].name')"
          if grep -Fq 'sidrena-static-php' <<<"$REMAINING"; then
            echo 'Retired Static PHP release asset still exists.' >&2
            exit 1
          fi
