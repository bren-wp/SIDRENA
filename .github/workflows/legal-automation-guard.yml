name: Sidrena legal automation guard

on:
  push:
    branches:
      - main
      - 'develop/**'
      - 'feature/**'
      - 'polish/**'
  pull_request:
    branches:
      - main
      - 'develop/**'
      - 'polish/**'

permissions:
  contents: read

jobs:
  legal-automation:
    name: Legal automation and source alignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Legal automation smoke test
        run: php .github/tests/legal-automation-smoke.php

      - name: Production legal-copy guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE '100% (pravno )?usklađ|100% (pravno )?usklad|jamči.*usklađen|garantira.*usklađen|pravna garancija' \
            --include='*.php' --include='*.md' --include='*.txt' . --exclude-dir=.git; then
            echo 'Unsafe legal-compliance guarantee detected.' >&2
            exit 1
          fi

      - name: Automation defaults guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const STANDARD_REFERENCE_DATE = '2026-09-10';" includes/class-sidrena-utils.php
          grep -Fq "const FMCG_REFERENCE_DATE     = '2025-05-02';" includes/class-sidrena-utils.php
          ! sed -n '/public static function defaults()/,/^\t}/p' includes/class-sidrena-utils.php | grep -Eq "'(default_ref_date|fmcg_ref_date|fmsid_ref_date)'[[:space:]]*=>"
          grep -Eq "'generation_time'[[:space:]]*=>[[:space:]]*'06:30'" includes/class-sidrena-utils.php
          grep -Eq "'strict_publication'[[:space:]]*=>[[:space:]]*'yes'" includes/class-sidrena-utils.php
          grep -Eq "'failure_notifications'[[:space:]]*=>[[:space:]]*'yes'" includes/class-sidrena-utils.php
          grep -Fq "wp_schedule_event( self::publication_watch_timestamp(), 'hourly', 'sidrena_publication_watch' );" includes/class-sidrena-activator.php
