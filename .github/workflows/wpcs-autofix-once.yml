name: SIDRENA one-time WPCS autofix

on:
  push:
    branches:
      - develop/1.0.25-wporg-deep-audit
    paths:
      - '.github/workflows/wpcs-autofix-once.yml'
      - 'phpcs.xml.dist'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: develop/1.0.25-wporg-deep-audit

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install WordPressCS
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSER_HOME="$RUNNER_TEMP/sidrena-wpcs-autofix"
          echo "COMPOSER_HOME=$COMPOSER_HOME" >> "$GITHUB_ENV"
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            dealerdirect/phpcodesniffer-composer-installer:1.2.1 \
            wp-coding-standards/wpcs:3.4.1

      - name: Apply safe PHPCBF fixes
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            set +e
            "$COMPOSER_HOME/vendor/bin/phpcbf" --standard=phpcs.xml.dist
            code=$?
            set -e
            if [ "$code" -gt 2 ]; then
              echo "PHPCBF returned unexpected exit code $code on pass $pass" >&2
              exit "$code"
            fi
            if [ "$code" -eq 0 ]; then
              break
            fi
          done
          git diff --check
          grep -Fq "if ( 'wordpress' === SIDRENA_EDITION )" includes/sidrena-bootstrap.php
          grep -Fq "? 'woocommerce' : 'wordpress';" includes/sidrena-edition-guard.php
          grep -Fq "return 'wordpress' === self::edition();" includes/class-sidrena-utils.php

      - name: Regression tests after formatter
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/legal-automation-smoke.php
          php .github/tests/legal-schema-smoke.php
          php .github/tests/wordpress-edition-smoke.php
          php .github/tests/woocommerce-edition-smoke.php
          php .github/tests/edition-conflict-smoke.php wordpress edition
          php .github/tests/edition-conflict-smoke.php woocommerce edition
          php .github/tests/edition-conflict-smoke.php wordpress legacy
          php .github/tests/edition-conflict-smoke.php woocommerce legacy

      - name: Commit formatter changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No PHPCBF changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes admin public editions uninstall.php
          git commit -m "Apply WordPress Coding Standards autofixes"
          git push origin HEAD:develop/1.0.25-wporg-deep-audit
