name: Sidrena CI

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Set up Node
        if: matrix.php == '8.3'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            node --check "$FILE"
          done < <(find admin public -type f -name '*.js' -print0)

      - name: Plugin metadata and WordPress.org checks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^ \* Version: //p' sidrena.php | head -n1)"
          CONSTANT_VERSION="$(sed -n "s/^define( 'SIDRENA_VERSION', '\([^']*\)' );$/\1/p" sidrena.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag: //p' readme.txt | head -n1)"
          test -n "$HEADER_VERSION"
          test "$HEADER_VERSION" = "$CONSTANT_VERSION"
          test "$HEADER_VERSION" = "$STABLE_TAG"
          grep -q 'Author: Brendigo' sidrena.php
          grep -q 'Author URI: https://brendigo.com/' sidrena.php
          grep -q 'Plugin URI: https://sidrena-cijena.com.hr/' sidrena.php
          grep -q 'License: GPLv2 or later' sidrena.php
          grep -q '^Donate link: https://sidrena-cijena.com.hr/#donirajte$' readme.txt
          test -f assets/images/logo-mark.svg
          test -f assets/images/logo-horizontal.svg
          test -f assets/images/admin-hero.svg
          test -f admin/css/admin-160.css
          test -f public/css/public.css
          test -f public/js/public.js
          test -f public/js/compat.js
          test -f includes/class-sidrena-public.php
          test -f includes/class-sidrena-compatibility.php
          test -f includes/class-sidrena-standalone.php
          test -f includes/class-sidrena-woo-import-export.php
          test -f languages/sidrena.pot
          test -f docs/legal-and-technical-notes.md
          test -f .wordpress-org/source/banner.svg
          for N in 1 2 3 4 5 6; do test -f ".wordpress-org/source/screenshot-${N}.svg"; done

      - name: Build production package smoke test
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/sidrena-package/sidrena"
          rm -rf "$RUNNER_TEMP/sidrena-package"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.wordpress-org/' \
            --exclude='docs/' \
            --exclude='.gitignore' \
            --exclude='README.md'
          cd "$RUNNER_TEMP/sidrena-package"
          zip -qr sidrena-smoke.zip sidrena
          unzip -l sidrena-smoke.zip > package-files.txt
          if grep -E '(^|/)(\.github|\.wordpress-org|docs)/|README\.md|\.gitignore' package-files.txt; then
            echo 'Development/documentation material leaked into production package.' >&2
            exit 1
          fi
          test -f "$STAGE/sidrena.php"
          test -f "$STAGE/readme.txt"
          test -f "$STAGE/admin/css/admin-160.css"
          test -f "$STAGE/public/css/public.css"
          test -f "$STAGE/public/js/public.js"
          test -f "$STAGE/public/js/compat.js"
          test -f "$STAGE/includes/class-sidrena-public.php"
          test -f "$STAGE/includes/class-sidrena-compatibility.php"
          test -f "$STAGE/includes/class-sidrena-standalone.php"
          test -f "$STAGE/includes/class-sidrena-woo-import-export.php"
          test -f "$STAGE/assets/images/logo-mark.svg"
          test -f "$STAGE/assets/images/logo-horizontal.svg"
          test -f "$STAGE/assets/images/admin-hero.svg"

      - name: Guard against inline PHP script/style blocks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '<script|<style' --include='*.php' . --exclude-dir=.git; then
            echo 'Inline script/style block detected in PHP source.' >&2
            exit 1
          fi

      - name: Guard against retired branding
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'cijenaguard|digiadria' . \
            --exclude-dir=.git \
            --exclude-dir=.github; then
            echo 'Retired branding detected.' >&2
            exit 1
          fi

      - name: Production-content guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'lorem ipsum|dev only|development placeholder|sample data only' \
            --include='*.php' --include='*.js' --include='*.css' --include='readme.txt' . \
            --exclude-dir=.git; then
            echo 'Development/placeholder content detected in production files.' >&2
            exit 1
          fi
