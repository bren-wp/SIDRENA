name: Sidrena CI

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Set up Node
        if: matrix.php == '8.3'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        if: matrix.php == '8.3'
        run: node --check admin/js/admin.js

      - name: Plugin metadata and WordPress.org checks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 1.5.0' sidrena.php
          grep -q "define( 'SIDRENA_VERSION', '1.5.0' );" sidrena.php
          grep -q 'Stable tag: 1.5.0' readme.txt
          grep -q 'Author: Brendigo' sidrena.php
          grep -q 'Author URI: https://brendigo.com/' sidrena.php
          grep -q 'Plugin URI: https://sidrena-cijena.com.hr/' sidrena.php
          grep -q 'License: GPLv2 or later' sidrena.php
          test -f assets/images/logo-mark.svg
          test -f languages/sidrena.pot
          test -f docs/legal-and-technical-notes.md

      - name: Guard against inline PHP script/style blocks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '<script|<style' --include='*.php' . --exclude-dir=.git; then
            echo 'Inline script/style block detected in PHP source.' >&2
            exit 1
          fi

      - name: Guard against retired branding
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'cijenaguard|digiadria' .             --exclude-dir=.git             --exclude-dir=.github; then
            echo 'Retired branding detected.' >&2
            exit 1
          fi
