name: Sidrena CI

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Install PDF build dependency
        if: matrix.php == '8.3'
        run: python3 -m pip install --disable-pip-version-check --quiet reportlab

      - name: Utility encoding/security smoke tests
        run: php .github/tests/utility-smoke.php

      - name: WordPress edition runtime smoke test
        run: php .github/tests/wordpress-edition-smoke.php

      - name: WooCommerce edition runtime smoke test
        run: php .github/tests/woocommerce-edition-smoke.php

      - name: Admin menu capability smoke test
        run: php .github/tests/admin-menu-access-smoke.php

      - name: Edition conflict guard smoke tests
        shell: bash
        run: |
          php .github/tests/edition-conflict-smoke.php wordpress edition
          php .github/tests/edition-conflict-smoke.php woocommerce edition
          php .github/tests/edition-conflict-smoke.php wordpress legacy
          php .github/tests/edition-conflict-smoke.php woocommerce legacy

      - name: Safe uninstall smoke tests
        shell: bash
        run: |
          php .github/tests/uninstall-smoke.php preserve
          php .github/tests/uninstall-smoke.php other-active
          php .github/tests/uninstall-smoke.php destroy

      - name: Edition-specific WP-CLI smoke tests
        shell: bash
        run: |
          php .github/tests/cli-edition-smoke.php wordpress
          php .github/tests/cli-edition-smoke.php woocommerce

      - name: Public page automation smoke test
        run: php .github/tests/public-page-smoke.php

      - name: WordPress linked-source price smoke test
        run: php .github/tests/wordpress-sync-smoke.php

      - name: Woo automatic price output smoke test
        run: php .github/tests/woo-output-smoke.php

      - name: Set up Node
        if: matrix.php == '8.3'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            node --check "$FILE"
          done < <(find admin public -type f -name '*.js' -print0)

      - name: Edition metadata checks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          WP_MAIN='editions/wordpress/sidrena-wordpress.php'
          WOO_MAIN='editions/woocommerce/sidrena-woocommerce.php'
          WP_VERSION="$(sed -n 's/^ \* Version: //p' "$WP_MAIN" | head -n1)"
          WOO_VERSION="$(sed -n 's/^ \* Version: //p' "$WOO_MAIN" | head -n1)"
          WP_STABLE="$(sed -n 's/^Stable tag: //p' editions/wordpress/readme.txt | head -n1)"
          WOO_STABLE="$(sed -n 's/^Stable tag: //p' editions/woocommerce/readme.txt | head -n1)"
          test -n "$WP_VERSION"
          test "$WP_VERSION" = "$WOO_VERSION"
          test "$WP_VERSION" = "$WP_STABLE"
          test "$WP_VERSION" = "$WOO_STABLE"
          grep -q '^ \* Plugin Name: Sidrena WordPress$' "$WP_MAIN"
          grep -q '^ \* Plugin Name: Sidrena WooCommerce$' "$WOO_MAIN"
          ! grep -qiE '^ \* Requires Plugins:.*woocommerce' "$WP_MAIN"
          grep -qiE '^ \* Requires Plugins:.*woocommerce' "$WOO_MAIN"
          grep -q "define( 'SIDRENA_EDITION', 'wordpress' );" "$WP_MAIN"
          grep -q "define( 'SIDRENA_EDITION', 'woocommerce' );" "$WOO_MAIN"
          grep -q 'Author: Brendigo' "$WP_MAIN"
          grep -q 'Author: Brendigo' "$WOO_MAIN"
          test -s docs/UPUTE-WORDPRESS.md
          test -s docs/UPUTE-WOOCOMMERCE.md
          test -x tools/build-editions.sh
          test ! -f sidrena.php
          grep -Fq 'is_wordpress_edition' includes/class-sidrena-utils.php
          grep -Fq 'is_woocommerce_edition' includes/class-sidrena-utils.php
          grep -Fq 'SIDRENA_EDITION' includes/sidrena-bootstrap.php
          grep -Fq '"Project-Id-Version: Sidrena 0.1.0\n"' languages/sidrena.pot
          OLD_DOMAIN='sidrena-cijena'
          if grep -RInF "${OLD_DOMAIN}.com.hr" . --exclude-dir=.git; then
            echo 'Retired Sidrena website domain detected.' >&2
            exit 1
          fi
          if grep -RInE 'remove_(menu|submenu)_page[[:space:]]*\(' --include='*.php' . --exclude-dir=.git; then
            echo 'Sidrena must not remove WordPress core admin menus.' >&2
            exit 1
          fi

      - name: Build both edition packages
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1)"
          OUT="$RUNNER_TEMP/sidrena-editions"
          mkdir -p "$OUT"
          ./tools/build-editions.sh "$VERSION" "$OUT"

          WP="$OUT/.sidrena-build/sidrena-wordpress"
          WOO="$OUT/.sidrena-build/sidrena-woocommerce"

          test -f "$OUT/sidrena-wordpress-$VERSION.zip"
          test -f "$OUT/sidrena-wordpress-$VERSION.zip.sha256"
          test -f "$OUT/sidrena-woocommerce-$VERSION.zip"
          test -f "$OUT/sidrena-woocommerce-$VERSION.zip.sha256"

          test -f "$WP/sidrena-wordpress.php"
          test -f "$WP/readme.txt"
          test -s "$WP/docs/SIDRENA-PODRSKA.pdf"
          test -f "$WP/includes/class-sidrena-standalone.php"
          test ! -f "$WP/includes/class-sidrena-products.php"
          test ! -f "$WP/includes/class-sidrena-history.php"
          test ! -f "$WP/includes/class-sidrena-location-data.php"
          test ! -f "$WP/includes/class-sidrena-location-history.php"
          test ! -f "$WP/includes/class-sidrena-bulk.php"
          test ! -f "$WP/includes/class-sidrena-woo-import-export.php"
          test ! -f "$WP/includes/class-sidrena-compatibility.php"
          test ! -f "$WP/sidrena.php"
          test ! -d "$WP/editions"

          test -f "$WOO/sidrena-woocommerce.php"
          test -f "$WOO/readme.txt"
          test -s "$WOO/docs/SIDRENA-PODRSKA.pdf"
          test -f "$WOO/includes/class-sidrena-products.php"
          test -f "$WOO/includes/class-sidrena-history.php"
          test -f "$WOO/includes/class-sidrena-location-data.php"
          test -f "$WOO/includes/class-sidrena-location-history.php"
          test -f "$WOO/includes/class-sidrena-bulk.php"
          test -f "$WOO/includes/class-sidrena-woo-import-export.php"
          test -f "$WOO/includes/class-sidrena-compatibility.php"
          test ! -f "$WOO/includes/class-sidrena-standalone.php"
          test ! -f "$WOO/sidrena.php"
          test ! -d "$WOO/editions"

          # Boot the exact staged packages after edition-specific classes have
          # physically been removed.
          php .github/tests/wordpress-edition-smoke.php "$WP"
          php .github/tests/woocommerce-edition-smoke.php "$WOO"
          php .github/tests/package-entrypoint-smoke.php "$WP" wordpress
          php .github/tests/package-entrypoint-smoke.php "$WOO" woocommerce

          unzip -l "$OUT/sidrena-wordpress-$VERSION.zip" > "$OUT/wordpress-files.txt"
          unzip -l "$OUT/sidrena-woocommerce-$VERSION.zip" > "$OUT/woocommerce-files.txt"

      - name: Guard against inline PHP script/style blocks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '<script|<style' --include='*.php' . --exclude-dir=.git; then
            echo 'Inline script/style block detected in PHP source.' >&2
            exit 1
          fi

      - name: Guard against retired branding
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'cijenaguard|digiadria' . --exclude-dir=.git --exclude-dir=.github; then
            echo 'Retired branding detected.' >&2
            exit 1
          fi

      - name: Distribution and production-copy guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'License: Sidrena Software License 1.0' editions/wordpress/sidrena-wordpress.php
          grep -Fq 'License: Sidrena Software License 1.0' editions/woocommerce/sidrena-woocommerce.php
          grep -Fq 'Brendigo LTD Developer' README.md
          grep -Fq 'sidrena@brendigo.com' README.md
          grep -Fq '+385 91 901 0092' README.md
          grep -Fq 'revolut.me/catanyus' includes/class-sidrena-utils.php
          grep -Fq 'sidrena_publication_watch' includes/class-sidrena-pricelist.php
          grep -Fq 'sidrena_standalone_sync_batch' includes/class-sidrena-standalone.php
          test ! -d .wordpress-org
          ! grep -q 'sidrena-wporg-assets' .github/workflows/release.yml
          ASSET_LINES="$(awk '/^[[:space:]]+files: \|/{flag=1;next} flag && /^[[:space:]]+\$\{\{ runner.temp \}\}\//{count++} END{print count+0}' .github/workflows/release.yml)"
          test "$ASSET_LINES" -eq 2
          if grep -RIniE 'bez telemetrije|Pro paywall|100% FREE|OPEN SOURCE · GPL|GPLv2\+|sidrene-cijene\.com\.hr/#donirajte'             --include='*.php' --include='*.md' --include='*.txt' --include='*.svg' .             --exclude-dir=.git --exclude='LICENSE'; then
            echo 'Retired product/distribution wording detected.' >&2
            exit 1
          fi

      - name: Production-content guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'lorem ipsum|dev only|development placeholder|sample data only' \
            --include='*.php' --include='*.js' --include='*.css' --include='readme.txt' . \
            --exclude-dir=.git; then
            echo 'Development/placeholder content detected in production files.' >&2
            exit 1
          fi

      - name: Debug and unfinished-code guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'var_dump[[:space:]]*\(|print_r[[:space:]]*\(|console\.log[[:space:]]*\(|\bTODO\b|\bFIXME\b' \
            --include='*.php' --include='*.js' --include='*.css' --include='readme.txt' . \
            --exclude-dir=.git --exclude-dir=.github; then
            echo 'Debug or unfinished-code marker detected in production files.' >&2
            exit 1
          fi

      - name: Secret-material guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' . \
            --exclude-dir=.git --exclude-dir=.github; then
            echo 'Potential secret material detected in production files.' >&2
            exit 1
          fi
