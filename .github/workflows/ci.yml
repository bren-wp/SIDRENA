name: Sidrena CI

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Utility encoding/security smoke tests
        run: php .github/tests/utility-smoke.php

      - name: No-WooCommerce runtime smoke test
        run: php .github/tests/no-woocommerce-smoke.php

      - name: Admin menu capability smoke test
        run: php .github/tests/admin-menu-access-smoke.php

      - name: Static PHP edition smoke test
        run: php .github/tests/static-php-smoke.php

      - name: Set up Node
        if: matrix.php == '8.3'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            node --check "$FILE"
          done < <(find admin public static-php/assets -type f -name '*.js' -print0)

      - name: Plugin metadata and WordPress.org checks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^ \* Version: //p' sidrena.php | head -n1)"
          CONSTANT_VERSION="$(sed -n "s/^define( 'SIDRENA_VERSION', '\([^']*\)' );$/\1/p" sidrena.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag: //p' readme.txt | head -n1)"
          test -n "$HEADER_VERSION"
          test "$HEADER_VERSION" = "$CONSTANT_VERSION"
          test "$HEADER_VERSION" = "$STABLE_TAG"
          STATIC_VERSION="$(sed -n "s/^    public const VERSION = '\([^']*\)';$/\1/p" static-php/src/SidrenaStatic.php | head -n1)"
          test "$HEADER_VERSION" = "$STATIC_VERSION"
          test -s docs/UPUTE.md
          grep -q "release/\\*" .github/workflows/release.yml
          grep -Fq "\"Project-Id-Version: Sidrena ${HEADER_VERSION}\\n\"" languages/sidrena.pot
          grep -q 'Author: Brendigo' sidrena.php
          grep -q 'Author URI: https://brendigo.com/' sidrena.php
          grep -q 'Plugin URI: https://sidrene-cijene.com.hr/' sidrena.php
          ! grep -qiE '^ \* Requires Plugins:.*woocommerce' sidrena.php
          grep -Fq 'Samostalni WordPress način' includes/class-sidrena-utils.php
          grep -Fq 'realtime_standalone_products' includes/class-sidrena-rest.php
          grep -q 'License: GPLv2 or later' sidrena.php
          grep -q '^Donate link: https://sidrene-cijene.com.hr/#donirajte$' readme.txt
          test -f assets/images/logo-mark.svg
          test -f assets/images/logo-horizontal.svg
          test -f assets/images/admin-hero.svg
          test -f admin/css/admin-160.css
          test -f public/css/public.css
          test -f public/js/public.js
          test -f public/js/compat.js
          test -f includes/class-sidrena-public.php
          test -f includes/class-sidrena-compatibility.php
          test -f includes/class-sidrena-standalone.php
          test -f includes/class-sidrena-woo-import-export.php
          test -f static-php/src/SidrenaStatic.php
          test -f static-php/index.php
          test -f static-php/api.php
          test -f static-php/download.php
          test -f static-php/generate.php
          test -f static-php/storage/.htaccess
          test -f static-php/storage/web.config
          test -f .github/tests/static-php-smoke.php
          test -f languages/sidrena.pot
          test -f docs/legal-and-technical-notes.md
          grep -Fq 'manage_sidrena' includes/class-sidrena-activator.php
          grep -Fq 'Sidrena_Utils::admin_menu_capability()' includes/class-sidrena-admin.php
          grep -Fq 'Sidrena_Utils::current_user_can_manage()' includes/class-sidrena-admin.php
          grep -Fq 'map_admin_capability' includes/class-sidrena-plugin.php
          test -f .github/tests/admin-menu-access-smoke.php
          OLD_DOMAIN='sidrena-cijena'
          if grep -RInF "${OLD_DOMAIN}.com.hr" . --exclude-dir=.git; then
            echo 'Retired Sidrena website domain detected.' >&2
            exit 1
          fi
          if grep -RInE 'remove_(menu|submenu)_page[[:space:]]*\(' --include='*.php' . --exclude-dir=.git; then
            echo 'Sidrena must not remove WordPress core admin menus.' >&2
            exit 1
          fi
          test -f .wordpress-org/source/banner.svg
          for N in 1 2 3 4 5 6; do test -f ".wordpress-org/source/screenshot-${N}.svg"; done

      - name: Build production package smoke test
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/sidrena-package/sidrena"
          rm -rf "$RUNNER_TEMP/sidrena-package"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.wordpress-org/' \
            --exclude='docs/' \
            --exclude='static-php/' \
            --exclude='.gitignore' \
            --exclude='README.md'
          cd "$RUNNER_TEMP/sidrena-package"
          zip -qr sidrena-smoke.zip sidrena
          unzip -l sidrena-smoke.zip > package-files.txt
          if grep -E '(^|/)(\.github|\.wordpress-org|docs|static-php)/|README\.md|\.gitignore' package-files.txt; then
            echo 'Development/documentation material leaked into production package.' >&2
            exit 1
          fi
          test -f "$STAGE/sidrena.php"
          test -f "$STAGE/readme.txt"
          test -f "$STAGE/admin/css/admin-160.css"
          test -f "$STAGE/public/css/public.css"
          test -f "$STAGE/public/js/public.js"
          test -f "$STAGE/public/js/compat.js"
          test -f "$STAGE/includes/class-sidrena-public.php"
          test -f "$STAGE/includes/class-sidrena-compatibility.php"
          test -f "$STAGE/includes/class-sidrena-standalone.php"
          test -f "$STAGE/includes/class-sidrena-woo-import-export.php"
          test -f "$STAGE/assets/images/logo-mark.svg"
          test -f "$STAGE/assets/images/logo-horizontal.svg"
          test -f "$STAGE/assets/images/admin-hero.svg"
          test ! -e "$STAGE/static-php"

      - name: Build Static PHP package smoke test
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          STATIC_STAGE="$RUNNER_TEMP/sidrena-static-package/sidrena-static-php"
          rm -rf "$RUNNER_TEMP/sidrena-static-package"
          mkdir -p "$STATIC_STAGE"
          rsync -a static-php/ "$STATIC_STAGE/"
          cd "$RUNNER_TEMP/sidrena-static-package"
          zip -qr sidrena-static-smoke.zip sidrena-static-php
          unzip -l sidrena-static-smoke.zip > static-package-files.txt
          test -f "$STATIC_STAGE/index.php"
          test -f "$STATIC_STAGE/api.php"
          test -f "$STATIC_STAGE/health.php"
          test -f "$STATIC_STAGE/download.php"
          test -f "$STATIC_STAGE/generate.php"
          test -f "$STATIC_STAGE/config.php"
          test -f "$STATIC_STAGE/src/SidrenaStatic.php"
          test -f "$STATIC_STAGE/storage/source/products.csv"
          test -f "$STATIC_STAGE/storage/source/services.csv"
          test -f "$STATIC_STAGE/storage/.htaccess"
          test -f "$STATIC_STAGE/storage/web.config"
          test ! -e "$STATIC_STAGE/sidrena.php"
          test ! -e "$STATIC_STAGE/includes"
          test ! -e "$STATIC_STAGE/admin"

      - name: Guard against inline PHP script/style blocks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '<script|<style' --include='*.php' . --exclude-dir=.git --exclude-dir=static-php; then
            echo 'Inline script/style block detected in PHP source.' >&2
            exit 1
          fi

      - name: Guard against retired branding
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'cijenaguard|digiadria' . \
            --exclude-dir=.git \
            --exclude-dir=.github; then
            echo 'Retired branding detected.' >&2
            exit 1
          fi

      - name: Production-content guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'lorem ipsum|dev only|development placeholder|sample data only' \
            --include='*.php' --include='*.js' --include='*.css' --include='readme.txt' . \
            --exclude-dir=.git; then
            echo 'Development/placeholder content detected in production files.' >&2
            exit 1
          fi

      - name: Debug and unfinished-code guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'var_dump[[:space:]]*\(|print_r[[:space:]]*\(|console\.log[[:space:]]*\(|\bTODO\b|\bFIXME\b' \
            --include='*.php' --include='*.js' --include='*.css' --include='readme.txt' . \
            --exclude-dir=.git --exclude-dir=.github; then
            echo 'Debug or unfinished-code marker detected in production files.' >&2
            exit 1
          fi

      - name: Secret-material guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' . \
            --exclude-dir=.git --exclude-dir=.github; then
            echo 'Potential secret material detected in production files.' >&2
            exit 1
          fi
