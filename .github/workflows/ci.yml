# Sidrena source file.
# Author: brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: Sidrena CI

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Sidrena source metadata
        run: python3 tools/apply-source-metadata.py --check

      - name: Admin renderer self-call guard
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('includes/class-sidrena-admin.php')
          source = path.read_text(encoding='utf-8')
          calls = set(re.findall(r'\$this->([A-Za-z_][A-Za-z0-9_]*)\s*\(', source))
          definitions = set(re.findall(r'(?:public|protected|private)\s+function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(', source))
          missing = sorted(calls - definitions)
          if missing:
              raise SystemExit('Undefined Sidrena_Admin self calls: ' + ', '.join(missing))
          PY

      - name: Install PDF build dependency
        if: matrix.php == '8.3'
        run: python3 -m pip install --disable-pip-version-check --quiet reportlab

      - name: Utility encoding/security smoke tests
        run: php .github/tests/utility-smoke.php

      - name: Streaming import and row-limit smoke test
        run: php .github/tests/import-streaming-smoke.php

      - name: NN 101/2026 price-list schema smoke test
        run: php .github/tests/legal-schema-smoke.php

      - name: Publication alert throttle smoke test
        run: php .github/tests/publication-alert-smoke.php

      - name: WordPress edition runtime smoke test
        run: php .github/tests/wordpress-edition-smoke.php

      - name: WooCommerce edition runtime smoke test
        run: php .github/tests/woocommerce-edition-smoke.php

      - name: WooCommerce import state smoke test
        run: php .github/tests/woo-import-state-smoke.php

      - name: Woo REST flattened pagination smoke test
        run: php .github/tests/rest-woocommerce-pagination-smoke.php

      - name: Woo location variation-order smoke test
        run: php .github/tests/location-variation-order-smoke.php

      - name: REST location resolution smoke test
        run: php .github/tests/rest-location-resolution-smoke.php

      - name: Location history batching smoke test
        run: php .github/tests/location-history-batching-smoke.php

      - name: Admin menu capability smoke test
        run: php .github/tests/admin-menu-access-smoke.php

      - name: Admin asset routing smoke test
        run: php .github/tests/admin-assets-smoke.php

      - name: Admin form UX smoke test
        run: php .github/tests/admin-form-ux-smoke.php

      - name: Reference admin UI smoke test
        run: php .github/tests/reference-admin-ui-smoke.php

      - name: Main README real-assets smoke test
        run: php .github/tests/readme-assets-smoke.php

      - name: Edition conflict guard smoke tests
        shell: bash
        run: |
          php .github/tests/edition-conflict-smoke.php wordpress edition
          php .github/tests/edition-conflict-smoke.php woocommerce edition
          php .github/tests/edition-conflict-smoke.php wordpress legacy
          php .github/tests/edition-conflict-smoke.php woocommerce legacy

      - name: Safe uninstall smoke tests
        shell: bash
        run: |
          php .github/tests/uninstall-smoke.php preserve
          php .github/tests/uninstall-smoke.php other-active
          php .github/tests/uninstall-smoke.php destroy

      - name: Edition-specific WP-CLI smoke tests
        shell: bash
        run: |
          php .github/tests/cli-edition-smoke.php wordpress
          php .github/tests/cli-edition-smoke.php woocommerce

      - name: Public page automation smoke test
        run: php .github/tests/public-page-smoke.php

      - name: Service scalability smoke test
        run: php .github/tests/service-scalability-smoke.php

      - name: Service first-publish anchor smoke test
        run: php .github/tests/service-first-publish-smoke.php

      - name: Cross-version upgrade compatibility smoke test
        run: php .github/tests/upgrade-compat-smoke.php

      - name: Release Plugin Check gate regression test
        run: php .github/tests/release-plugin-check-gate-smoke.php

      - name: Plugin Check workflow regression test
        run: php .github/tests/plugin-check-workflow-smoke.php

      - name: WordPress.org review regression guard
        run: php .github/tests/wporg-review-smoke.php

      - name: Grouped public archive runtime test
        run: php .github/tests/public-archive-groups-smoke.php

      - name: Atomic public snapshot smoke test
        run: php .github/tests/publication-write-smoke.php

      - name: Transactional generation smoke test
        run: php .github/tests/generation-transaction-smoke.php

      - name: Streaming public snapshot smoke test
        run: php .github/tests/public-snapshot-stream-smoke.php

      - name: Streaming public snapshot runtime test
        run: php .github/tests/public-snapshot-runtime-smoke.php

      - name: WordPress linked-source price smoke test
        run: php .github/tests/wordpress-sync-smoke.php

      - name: Woo automatic price output smoke test
        run: php .github/tests/woo-output-smoke.php

      - name: Support and public surface smoke test
        run: php .github/tests/support-surface-smoke.php

      - name: Canonical URL source-integrity smoke test
        run: php .github/tests/canonical-url-smoke.php

      - name: Set up Node
        if: matrix.php == '8.3'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: JavaScript syntax
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            node --check "$FILE"
          done < <(find admin public -type f -name '*.js' -print0)

      - name: Woo variation hydration behavior smoke test
        if: matrix.php == '8.3'
        run: node .github/tests/woo-compat-hydration-smoke.js

      - name: Edition metadata checks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          WP_MAIN='editions/wordpress/sidrena-wordpress.php'
          WOO_MAIN='editions/woocommerce/sidrena-woocommerce.php'
          WP_VERSION="$(sed -n 's/^ \* Version: //p' "$WP_MAIN" | head -n1)"
          WOO_VERSION="$(sed -n 's/^ \* Version: //p' "$WOO_MAIN" | head -n1)"
          WP_STABLE="$(sed -n 's/^Stable tag: //p' editions/wordpress/readme.txt | head -n1)"
          WOO_STABLE="$(sed -n 's/^Stable tag: //p' editions/woocommerce/readme.txt | head -n1)"
          test -n "$WP_VERSION"
          test "$WP_VERSION" = "$WOO_VERSION"
          test "$WP_VERSION" = "$WP_STABLE"
          test "$WP_VERSION" = "$WOO_STABLE"
          grep -Fq 'Plugin Name: brendigo Sidrene cijene i digitalni cjenici' "$WP_MAIN"
          grep -Fq 'Plugin Name: brendigo Sidrene cijene i cjenici' "$WOO_MAIN"
          grep -q '^ \* Text Domain: brendigo-sidrene-cijene-digitalni-cjenici$' "$WP_MAIN"
          grep -q '^ \* Text Domain: brendigo-sidrene-cijene-cjenici$' "$WOO_MAIN"
          ! grep -qiE '^ \* Requires Plugins:.*woocommerce' "$WP_MAIN"
          grep -qiE '^ \* Requires Plugins:.*woocommerce' "$WOO_MAIN"
          grep -q "define( 'SIDRENA_EDITION', 'wordpress' );" "$WP_MAIN"
          grep -q "define( 'SIDRENA_EDITION', 'woocommerce' );" "$WOO_MAIN"
          grep -q 'Author: brendigo' "$WP_MAIN"
          grep -q 'Author: brendigo' "$WOO_MAIN"
          grep -Fq 'Author URI: https://brendigo.com/' "$WP_MAIN"
          grep -Fq 'Author URI: https://brendigo.com/' "$WOO_MAIN"
          grep -Fq 'Plugin URI: https://brendigo.com/sidrene-cijene/' "$WP_MAIN"
          grep -Fq 'Plugin URI: https://brendigo.com/sidrene-cijene/' "$WOO_MAIN"
          grep -Fq 'License: GPLv2 or later' "$WP_MAIN"
          grep -Fq 'License URI: https://www.gnu.org/licenses/gpl-2.0.html' "$WP_MAIN"
          grep -Fq 'License: GPLv2 or later' "$WOO_MAIN"
          grep -Fq 'License URI: https://www.gnu.org/licenses/gpl-2.0.html' "$WOO_MAIN"
          grep -Fqi 'brendigo' LICENSE
          grep -Fq 'GNU General Public License v2 or later' LICENSE
          test -s docs/UPUTE-WORDPRESS.md
          test -s docs/UPUTE-WOOCOMMERCE.md
          test -x tools/build-editions.sh
          test ! -f sidrena.php
          grep -Fq 'is_wordpress_edition' includes/class-sidrena-utils.php
          grep -Fq 'is_woocommerce_edition' includes/class-sidrena-utils.php
          grep -Fq 'SIDRENA_EDITION' includes/sidrena-bootstrap.php
          grep -Fq "\"Project-Id-Version: Sidrena ${WP_VERSION}\\n\"" languages/sidrena.pot
          if grep -RInE 'https?://(www[.])?sidren(a|e)-cijen(a|e)[.]com[.]hr/?' \
            includes admin public assets editions languages docs uninstall.php tools/build-editions.sh tools/build-support-pdf.py; then
            echo 'Retired Sidrena website domain detected in production source.' >&2
            exit 1
          fi
          if grep -RInE 'remove_(menu|submenu)_page[[:space:]]*\(' --include='*.php' . --exclude-dir=.git; then
            echo 'Sidrena must not remove WordPress core admin menus.' >&2
            exit 1
          fi

      - name: Build both edition packages
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1)"
          OUT="$RUNNER_TEMP/sidrena-editions"
          REPEAT_OUT="$RUNNER_TEMP/sidrena-editions-repeat"
          mkdir -p "$OUT" "$REPEAT_OUT"

          ./tools/build-editions.sh "$VERSION" "$OUT"
          ./tools/build-editions.sh "$VERSION" "$REPEAT_OUT"

          cmp "$OUT/sidrena-wordpress-$VERSION.zip" "$REPEAT_OUT/sidrena-wordpress-$VERSION.zip"
          cmp "$OUT/sidrena-woocommerce-$VERSION.zip" "$REPEAT_OUT/sidrena-woocommerce-$VERSION.zip"
          cmp "$OUT/sidrena-wordpress-$VERSION.zip.sha256" "$REPEAT_OUT/sidrena-wordpress-$VERSION.zip.sha256"
          cmp "$OUT/sidrena-woocommerce-$VERSION.zip.sha256" "$REPEAT_OUT/sidrena-woocommerce-$VERSION.zip.sha256"

          WP_ZIP="$OUT/sidrena-wordpress-$VERSION.zip"
          WOO_ZIP="$OUT/sidrena-woocommerce-$VERSION.zip"
          WP="$OUT/.sidrena-build/sidrena-wordpress"
          WOO="$OUT/.sidrena-build/sidrena-woocommerce"

          for ZIP in "$WP_ZIP" "$WOO_ZIP"; do
            test -s "$ZIP"
            SIZE="$(stat -c%s "$ZIP")"
            echo "$(basename "$ZIP"): $SIZE bytes"
            test "$SIZE" -le 1572864
          done

          (
            cd "$OUT"
            sha256sum -c "sidrena-wordpress-$VERSION.zip.sha256"
            sha256sum -c "sidrena-woocommerce-$VERSION.zip.sha256"
          )
          unzip -t "$WP_ZIP" >/dev/null
          unzip -t "$WOO_ZIP" >/dev/null

          test -f "$WP/sidrena-wordpress.php"
          test -f "$WP/readme.txt"
          test -s "$WP/docs/UPUTE.md"
          test -s "$WP/docs/SIDRENA-UPUTE.pdf"
          test -f "$WP/includes/class-sidrena-standalone.php"
          test ! -f "$WP/includes/class-sidrena-products.php"
          test ! -f "$WP/includes/class-sidrena-history.php"
          test ! -f "$WP/includes/class-sidrena-location-data.php"
          test ! -f "$WP/includes/class-sidrena-location-history.php"
          test ! -f "$WP/includes/class-sidrena-bulk.php"
          test ! -f "$WP/includes/class-sidrena-woo-import-export.php"
          test ! -f "$WP/includes/class-sidrena-compatibility.php"
          test ! -d "$WP/branding"
          test ! -d "$WP/docs/images"
          test ! -f "$WP/sidrena.php"
          test ! -d "$WP/editions"

          test -f "$WOO/sidrena-woocommerce.php"
          test -f "$WOO/readme.txt"
          test -s "$WOO/docs/UPUTE.md"
          test -s "$WOO/docs/SIDRENA-UPUTE.pdf"
          test -f "$WOO/includes/class-sidrena-products.php"
          test -f "$WOO/includes/class-sidrena-history.php"
          test -f "$WOO/includes/class-sidrena-location-data.php"
          test -f "$WOO/includes/class-sidrena-location-history.php"
          test -f "$WOO/includes/class-sidrena-bulk.php"
          test -f "$WOO/includes/class-sidrena-woo-import-export.php"
          test -f "$WOO/includes/class-sidrena-compatibility.php"
          test ! -f "$WOO/includes/class-sidrena-standalone.php"
          test ! -d "$WOO/branding"
          test ! -d "$WOO/docs/images"
          test ! -f "$WOO/sidrena.php"
          test ! -d "$WOO/editions"

          test -s "$WP/admin/css/brand.css"
          test -s "$WOO/admin/css/brand.css"
          test -s "$WP/admin/js/admin.js"
          test -s "$WOO/admin/js/admin.js"
          test -s "$WP/assets/images/menu-anchor.svg"
          test -s "$WOO/assets/images/menu-anchor.svg"
          test -s "$WP/assets/images/logo-wordpress-light.svg"
          test -s "$WOO/assets/images/logo-woocommerce-light.svg"
          grep -Fq 'Text Domain: brendigo-sidrene-cijene-digitalni-cjenici' "$WP/sidrena-wordpress.php"
          grep -Fq 'Text Domain: brendigo-sidrene-cijene-cjenici' "$WOO/sidrena-woocommerce.php"
          test -f "$WP/languages/brendigo-sidrene-cijene-digitalni-cjenici.pot"
          test -f "$WOO/languages/brendigo-sidrene-cijene-cjenici.pot"
          test ! -f "$WP/languages/sidrena-wordpress.pot"
          test ! -f "$WOO/languages/sidrena-woocommerce.pot"
          grep -Fq 'X-Domain: brendigo-sidrene-cijene-digitalni-cjenici' "$WP/languages/brendigo-sidrene-cijene-digitalni-cjenici.pot"
          grep -Fq 'X-Domain: brendigo-sidrene-cijene-cjenici' "$WOO/languages/brendigo-sidrene-cijene-cjenici.pot"
          ! grep -RInF 'https://sidrene-cijene.com.hr/' "$WP" "$WOO"

          php .github/tests/wordpress-edition-smoke.php "$WP"
          php .github/tests/woocommerce-edition-smoke.php "$WOO"
          php .github/tests/package-entrypoint-smoke.php "$WP" wordpress
          php .github/tests/package-entrypoint-smoke.php "$WOO" woocommerce

      - name: Guard against inline PHP script/style blocks
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '<script|<style' --include='*.php' . --exclude-dir=.git; then
            echo 'Inline script/style block detected in PHP source.' >&2
            exit 1
          fi

      - name: Guard against retired branding
        if: matrix.php == '8.3'
        shell: bash
        run: |
          if grep -RInE 'Cjenikomat|cjenikomat' includes admin public assets editions languages docs branding wporg-assets tools --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.pdf'; then
            echo 'Retired Cjenikomat branding detected; SIDRENA must remain the runtime and visual brand.' >&2
            exit 1
          fi
          set -euo pipefail
          RETIRED_NAME_A="cijena""guard"
          RETIRED_NAME_B="digi""adria"
          RETIRED_BRENDIGO='brendigo[[:space:]]+LTD([[:space:]]+Developer)?'
          if grep -RIniE "${RETIRED_NAME_A}|${RETIRED_NAME_B}|${RETIRED_BRENDIGO}" . --exclude-dir=.git; then
            echo 'Retired branding detected.' >&2
            exit 1
          fi

      - name: Distribution and production-copy guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'License: GPLv2 or later' editions/wordpress/sidrena-wordpress.php
          grep -Fq 'License: GPLv2 or later' editions/woocommerce/sidrena-woocommerce.php
          grep -Fq 'brendigo' README.md
          grep -Fq 'sidrena@brendigo.com' README.md
          grep -Fq '+385 91 901 0092' README.md
          if grep -RInF 'revolut.me' includes admin public editions docs tools --exclude='*.pdf'; then
            echo 'Donation hyperlink detected; production and bundled documentation must remain free of donation URLs.' >&2
            exit 1
          fi
          grep -Fq "return '80 EUR';" includes/class-sidrena-utils.php
          ! grep -Fq 'Dobrovoljna donacija' includes/class-sidrena-admin.php
          ! grep -Fq 'donation_url' includes/class-sidrena-admin.php
          grep -Fq '[sidrena_objava_cjenika]' README.md
          grep -Fq 'sidrena@brendigo.com' tools/build-support-pdf.py
          if grep -RIniE '20 EUR|mjesečno tehničko održavanje|održavanje - 20|opcionalno tehničko održavanje|maintenance_price'             --include='*.php' --include='*.md' --include='*.txt' --include='*.py' .             --exclude-dir=.git --exclude-dir=.github; then
            echo 'Unrequested recurring maintenance offer detected.' >&2
            exit 1
          fi
          grep -Fq 'sidrena_publication_watch' includes/class-sidrena-pricelist.php
          grep -Fq 'sidrena_standalone_sync_batch' includes/class-sidrena-standalone.php
          test ! -d .wordpress-org
          test ! -f .github/workflows/wporg-assets.yml
          ! grep -q 'sidrena-wporg-assets' .github/workflows/release.yml
          ASSET_LINES="$(awk '/^[[:space:]]+files: \|/{flag=1;next} flag && /^[[:space:]]+\$\{\{ runner.temp \}\}\//{count++} END{print count+0}' .github/workflows/release.yml)"
          test "$ASSET_LINES" -eq 4
          grep -Eq 'sidrena-wordpress-.*\.zip\.sha256' .github/workflows/release.yml
          grep -Eq 'sidrena-woocommerce-.*\.zip\.sha256' .github/workflows/release.yml
          if grep -RIniE 'Pro paywall|100% FREE|sidrene-cijene\.com\.hr/#donirajte'             --include='*.php' --include='*.md' --include='*.txt' --include='*.svg' .             --exclude-dir=.git --exclude='LICENSE'; then
            echo 'Retired product/distribution wording detected.' >&2
            exit 1
          fi

      - name: Legal-copy guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE '100% (pravno )?usklađ|100% (pravno )?usklad|jamči.*usklađen|garantira.*usklađen' \
            --include='*.php' --include='*.md' --include='*.txt' . --exclude-dir=.git; then
            echo 'Unsafe legal-compliance guarantee detected.' >&2
            exit 1
          fi

      - name: Production-content guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'lorem ipsum|dev only|development placeholder|sample data only|ChatGPT|OpenAI|AI-generated|generated by AI|Generated by ChatGPT|AI-assisted|Claude|Copilot|(^|[^A-Za-z0-9_])LLM([^A-Za-z0-9_]|$)' \
            --include='*.php' --include='*.js' --include='*.css' --include='*.md' --include='readme.txt' \
            includes admin public editions assets docs README.md tools uninstall.php \
            2>/dev/null; then
            echo 'Development, placeholder, or generated-content marker detected in production files.' >&2
            exit 1
          fi

      - name: Debug and unfinished-code guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'var_dump[[:space:]]*\(|print_r[[:space:]]*\(|console\.log[[:space:]]*\(|\bTODO\b|\bFIXME\b' \
            --include='*.php' --include='*.js' --include='*.css' --include='readme.txt' . \
            --exclude-dir=.git --exclude-dir=.github; then
            echo 'Debug or unfinished-code marker detected in production files.' >&2
            exit 1
          fi

      - name: Dangerous PHP primitive guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(includes editions uninstall.php)
          if grep -RInE '\b(eval|assert|system|shell_exec|passthru|exec|proc_open|popen)[[:space:]]*\(' "${TARGETS[@]}" --include='*.php'; then
            echo 'Dangerous PHP execution primitive detected.' >&2
            exit 1
          fi
          if grep -RInE '\bunserialize[[:space:]]*\(' "${TARGETS[@]}" --include='*.php'; then
            echo 'Raw unserialize detected.' >&2
            exit 1
          fi
          if grep -RInE '\bbase64_decode[[:space:]]*\(' "${TARGETS[@]}" --include='*.php'; then
            echo 'Encoded PHP payload primitive detected.' >&2
            exit 1
          fi
          if grep -RInE '\$_(REQUEST|COOKIE)\b' "${TARGETS[@]}" --include='*.php'; then
            echo 'Broad or cookie superglobal use detected; use explicit validated input.' >&2
            exit 1
          fi
          if grep -RInE '(include|require)(_once)?[[:space:]]*\(?[[:space:]]*["'"'"']https?://' "${TARGETS[@]}" --include='*.php'; then
            echo 'Remote PHP include detected.' >&2
            exit 1
          fi

      - name: Secret-material guard
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' . \
            --exclude-dir=.git --exclude-dir=.github; then
            echo 'Potential secret material detected in production files.' >&2
            exit 1
          fi
