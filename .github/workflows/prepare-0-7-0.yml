# Sidrena source file.
# Author: Brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://sidrene-cijene.com.hr/
# Support: sidrena@brendigo.com

name: Prepare Sidrena 0.7.0 metadata

on:
  push:
    branches:
      - releaseprep/0.7.0

permissions:
  contents: write

jobs:
  prepare:
    name: Align 0.7.0 release metadata
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: releaseprep/0.7.0
      - name: Update metadata and documentation
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php
          $files = [
              'editions/wordpress/readme.txt',
              'editions/woocommerce/readme.txt',
              'README.md',
              'languages/sidrena.pot',
          ];

          foreach ($files as $file) {
              if (!is_file($file)) {
                  continue;
              }
              $content = file_get_contents($file);
              $content = str_replace('Sidrena WordPress 0.6.0', 'Sidrena WordPress 0.7.0', $content);
              $content = str_replace('Sidrena WooCommerce 0.6.0', 'Sidrena WooCommerce 0.7.0', $content);
              $content = str_replace('Sidrena 0.6.0', 'Sidrena 0.7.0', $content);
              $content = str_replace('Stable tag: 0.6.0', 'Stable tag: 0.7.0', $content);
              $content = str_replace('sidrena-wordpress-0.6.0.zip', 'sidrena-wordpress-0.7.0.zip', $content);
              $content = str_replace('sidrena-woocommerce-0.6.0.zip', 'sidrena-woocommerce-0.7.0.zip', $content);
              $content = str_replace('Project-Id-Version: Sidrena 0.6.0', 'Project-Id-Version: Sidrena 0.7.0', $content);
              file_put_contents($file, $content);
          }

          $readmeEntry = "= 0.7.0 =\n* Dodana je nativna Windows aplikacija pod /windows, temeljena na WinUI 3 / Windows App SDK, bez Electrona, Taurija, WebView2 shell pristupa i legacy WinForms/WPF UI-ja.\n* Dodan je Windows app guard koji provjerava native-only strukturu i stvarni dotnet build na windows-latest runneru.\n* Dodana je release automatizacija za Windows assete: portable.exe i setup.exe uz postojeća dva plugin ZIP paketa.\n* Windows dokumentacija opisuje lokalni katalog, legal-readiness provjeru, CSV/XML/HTML export i buduću sigurnu sinkronizaciju prema Sidrena pluginu.\n\n";

          foreach (['editions/wordpress/readme.txt', 'editions/woocommerce/readme.txt'] as $file) {
              if (!is_file($file)) {
                  continue;
              }
              $content = file_get_contents($file);
              if (false === strpos($content, '= 0.7.0 =')) {
                  $content = str_replace("== Changelog ==\n\n", "== Changelog ==\n\n" . $readmeEntry, $content);
              }
              file_put_contents($file, $content);
          }

          if (is_file('changelog.txt')) {
              $content = file_get_contents('changelog.txt');
              if (false === strpos($content, '= 0.7.0 =')) {
                  $entry = "= 0.7.0 =\n* Dodana je nativna Windows aplikacija pod /windows kao premium desktop temelj za lokalnu pripremu i provjeru sidrenih cijena.\n* Windows aplikacija koristi WinUI 3 / Windows App SDK i ima CI guard koji blokira Electron, Tauri, WebView2 shell i legacy desktop pristup.\n* Release automatizacija sada priprema i provjerava Windows portable.exe i setup.exe assete uz dva službena plugin ZIP paketa.\n* Dokumentacija je proširena za Windows smjer, lokalni export i buduću sigurnu WordPress/WooCommerce sinkronizaciju.\n\n";
                  $content = str_replace("= 0.6.0 =\n", $entry . "= 0.6.0 =\n", $content);
              }
              file_put_contents('changelog.txt', $content);
          }
          PHP

          if ! grep -R "0.6.0" editions/wordpress/sidrena-wordpress.php editions/woocommerce/sidrena-woocommerce.php editions/wordpress/readme.txt editions/woocommerce/readme.txt languages/sidrena.pot README.md changelog.txt >/tmp/sidrena-remaining-060.txt 2>/dev/null; then
            true
          else
            echo "Remaining 0.6.0 markers:"
            cat /tmp/sidrena-remaining-060.txt
            # Historical changelog entries may remain; enforce only critical metadata separately.
          fi

      - name: Commit release metadata alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add editions/wordpress/readme.txt editions/woocommerce/readme.txt README.md languages/sidrena.pot changelog.txt
          if git diff --cached --quiet; then
            echo "No 0.7.0 metadata changes to commit."
            exit 0
          fi
          git commit -m "Align Sidrena 0.7.0 release metadata and docs"
          git push origin HEAD:releaseprep/0.7.0
