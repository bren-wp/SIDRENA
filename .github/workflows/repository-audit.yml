name: SIDRENA all-platform source audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check official WordPress package fingerprint, duplicates, binaries
        run: python3 tools/audit_repository.py
      - name: 'Regression: downloaded release binaries are not committed sources'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          printf 'transient artifact' > release/SIDRENA-Android-debug.apk
          python3 tools/audit_repository.py
          rm -f release/SIDRENA-Android-debug.apk
      - name: PHP syntax validation across the official plugin
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/brendigo-sidrena-cijena -name '*.php' -type f -print0 |
            xargs -0 -n 1 php -l >/tmp/sidrena-php-audit.log
          tail -n 4 /tmp/sidrena-php-audit.log
      - name: Verify shared legal contract and production package layout
        run: |
          php tools/test_legal_contract.php
          python3 tools/audit_security.py
      - name: Desktop source and obvious dead-code audit
        run: python3 tools/audit_desktop.py
      - name: Android source and obvious dead-code audit
        run: python3 tools/audit_android.py
