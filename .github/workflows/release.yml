name: Build Sidrena release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and plugin version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION="$(sed -n 's/^ \* Version: //p' sidrena.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag: //p' readme.txt | head -n1)"
          test "$TAG_VERSION" = "$HEADER_VERSION"
          test "$TAG_VERSION" = "$STABLE_TAG"

      - name: Build installable plugin archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$RUNNER_TEMP/sidrena"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.wordpress-org/' \
            --exclude='docs/' \
            --exclude='.gitignore' \
            --exclude='README.md'
          cd "$RUNNER_TEMP"
          zip -qr "sidrena-${VERSION}.zip" sidrena
          sha256sum "sidrena-${VERSION}.zip" > "sidrena-${VERSION}.zip.sha256"

      - name: Build WordPress.org visual assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="$RUNNER_TEMP/wporg-assets"
          mkdir -p "$OUT"
          rsvg-convert -w 772 -h 250 .wordpress-org/source/banner.svg > "$OUT/banner-772x250.png"
          rsvg-convert -w 1544 -h 500 .wordpress-org/source/banner.svg > "$OUT/banner-1544x500.png"
          rsvg-convert -w 128 -h 128 assets/images/logo-mark.svg > "$OUT/icon-128x128.png"
          rsvg-convert -w 256 -h 256 assets/images/logo-mark.svg > "$OUT/icon-256x256.png"
          cp assets/images/logo-mark.svg "$OUT/icon.svg"
          for N in 1 2 3 4 5 6; do
            rsvg-convert -w 1448 -h 1086 ".wordpress-org/source/screenshot-${N}.svg" > "$OUT/screenshot-${N}.png"
          done
          cd "$RUNNER_TEMP"
          zip -qr "sidrena-wporg-assets-${VERSION}.zip" wporg-assets
          sha256sum "sidrena-wporg-assets-${VERSION}.zip" > "sidrena-wporg-assets-${VERSION}.zip.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/sidrena-*.zip
            ${{ runner.temp }}/sidrena-*.zip.sha256
