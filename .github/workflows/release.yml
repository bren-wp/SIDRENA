# Sidrena source file.
# Author: Brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: Build Sidrena editions release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          WP_VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1)"
          WOO_VERSION="$(sed -n 's/^ \* Version: //p' editions/woocommerce/sidrena-woocommerce.php | head -n1)"
          WP_STABLE="$(sed -n 's/^Stable tag: //p' editions/wordpress/readme.txt | head -n1)"
          WOO_STABLE="$(sed -n 's/^Stable tag: //p' editions/woocommerce/readme.txt | head -n1)"
          test "$VERSION" = "$WP_VERSION"
          test "$VERSION" = "$WOO_VERSION"
          test "$VERSION" = "$WP_STABLE"
          test "$VERSION" = "$WOO_STABLE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
          echo "REFRESH_RELEASE=false" >> "$GITHUB_ENV"

      - name: Require final 0.9.0 release branch to match main
        if: startsWith(github.ref, 'refs/heads/release/') && env.VERSION == '0.9.0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$MAIN_SHA" ]]; then
            echo "release/0.9.0 must point at the final main commit before publishing." >&2
            echo "release=$GITHUB_SHA main=$MAIN_SHA" >&2
            exit 1
          fi
      - name: Refresh first public 0.1.0 release when rebuilding from release branch
        if: startsWith(github.ref, 'refs/heads/release/') && env.VERSION == '0.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG_NAME\") | .id" | head -n1)"
          if [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Removing previous $TAG_NAME release before the final 0.1.0 rebuild."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Removing previous $TAG_NAME tag before the final 0.1.0 rebuild."
            git push origin --delete "$TAG_NAME"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Removing checkout-local $TAG_NAME tag before recreating it."
            git tag -d "$TAG_NAME"
          fi

      - name: Resolve or create release tag from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            EXISTING_TAG_TARGET="$(git rev-list -n 1 "$TAG_NAME")"
            if [[ "$EXISTING_TAG_TARGET" == "$GITHUB_SHA" ]]; then
              echo "Tag $TAG_NAME already points at the release commit."
            elif [[ "$VERSION" == "0.9.0" ]]; then
              echo "Existing $TAG_NAME points at $EXISTING_TAG_TARGET; controlled refresh is required."
              echo "REFRESH_RELEASE=true" >> "$GITHUB_ENV"
            else
              echo "Tag $TAG_NAME already exists at a different commit; refusing implicit retarget." >&2
              exit 1
            fi
          else
            git tag -a "$TAG_NAME" "$GITHUB_SHA" -m "Sidrena $VERSION"
            git push origin "$TAG_NAME"
          fi

      - name: Resolve tag target and release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [[ "${REFRESH_RELEASE:-false}" == "true" ]]; then
            RELEASE_TARGET="$GITHUB_SHA"
          else
            RELEASE_TARGET="$(git rev-list -n 1 "$TAG_NAME")"
          fi
          test -n "$RELEASE_TARGET"
          echo "RELEASE_TARGET=$RELEASE_TARGET" >> "$GITHUB_ENV"

          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.id' 2>/dev/null || true)"
          if [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
            echo "EXISTING_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
            echo "EXISTING_RELEASE_ID=" >> "$GITHUB_ENV"
          fi

      - name: Prepare release body
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sidrena-release-body.md" <<EOF
          ## Sidrena $VERSION

          Sidrena $VERSION donosi potpuno novi produkcijski UI/UX i jedinstven Sidrena branding za dva odvojena WordPress plugina:

          - **Sidrena WordPress** — za postojeći WordPress sadržaj i vlastiti katalog.
          - **Sidrena WooCommerce** — za postojeće WooCommerce proizvode i varijacije, bez dupliciranja kataloga.

          Oba paketa uključuju novi Sidrena 0.9 vizualni sustav, lokalnu S + sidro menu ikonu, responzivno administratorsko sučelje, javne cjenike, CSV/XML, arhivu, stvarne runtime screenshotove u dokumentaciji i edition-specific branding paket.

          WordPress.org screenshotovi snimaju se iz stvarnog aktivnog wp-admin okruženja, a release objavljuje samo dva instalacijska ZIP-a.

          Jednokratna instalacija i početno postavljanje od strane Brendiga: 80 EUR.
          Dobrovoljna donacija za razvoj dostupna je izravno preko Revoluta u administraciji plugina.

          Podrška: sidrena@brendigo.com
          Autor: Brendigo
          Službena stranica: https://brendigo.com/sidrene-cijene/
          EOF

      - name: Install PDF build dependency
        if: env.RELEASE_EXISTS != 'true' || env.REFRESH_RELEASE == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet reportlab

      - name: Build WordPress and WooCommerce ZIPs
        if: env.RELEASE_EXISTS != 'true' || env.REFRESH_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_TARGET")" ./tools/build-editions.sh "$VERSION" "$RUNNER_TEMP"

      - name: Verify fresh release build before publishing
        if: env.RELEASE_EXISTS != 'true' || env.REFRESH_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP"
            sha256sum -c "sidrena-wordpress-$VERSION.zip.sha256"
            sha256sum -c "sidrena-woocommerce-$VERSION.zip.sha256"
          )
          unzip -t "$RUNNER_TEMP/sidrena-wordpress-$VERSION.zip" >/dev/null
          unzip -t "$RUNNER_TEMP/sidrena-woocommerce-$VERSION.zip" >/dev/null

      - name: Retarget stale 0.9.0 tag before a new release
        if: startsWith(github.ref, 'refs/heads/release/') && env.REFRESH_RELEASE == 'true' && env.RELEASE_EXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = "0.9.0"
          test "$RELEASE_TARGET" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG_NAME" "$RELEASE_TARGET" -m "Sidrena $VERSION"
          git push --force origin "refs/tags/$TAG_NAME"

      - name: Publish new GitHub release
        if: env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ env.RELEASE_TARGET }}
          name: Sidrena ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: ${{ runner.temp }}/sidrena-release-body.md
          files: |
            ${{ runner.temp }}/sidrena-wordpress-${{ env.VERSION }}.zip
            ${{ runner.temp }}/sidrena-wordpress-${{ env.VERSION }}.zip.sha256
            ${{ runner.temp }}/sidrena-woocommerce-${{ env.VERSION }}.zip
            ${{ runner.temp }}/sidrena-woocommerce-${{ env.VERSION }}.zip.sha256

      - name: Refresh existing release metadata and final 0.9.0 assets when required
        if: env.RELEASE_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${REFRESH_RELEASE:-false}" == "true" ]]; then
            test "$VERSION" = "0.9.0"
            gh release upload "$TAG_NAME" \
              "$RUNNER_TEMP/sidrena-wordpress-$VERSION.zip" \
              "$RUNNER_TEMP/sidrena-wordpress-$VERSION.zip.sha256" \
              "$RUNNER_TEMP/sidrena-woocommerce-$VERSION.zip" \
              "$RUNNER_TEMP/sidrena-woocommerce-$VERSION.zip.sha256" \
              --clobber --repo "$GITHUB_REPOSITORY"
          fi

          jq -n \
            --arg tag "$TAG_NAME" \
            --arg target "$RELEASE_TARGET" \
            --arg name "Sidrena $VERSION" \
            --rawfile body "$RUNNER_TEMP/sidrena-release-body.md" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}' \
            > "$RUNNER_TEMP/release-update.json"

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${EXISTING_RELEASE_ID}" \
            --input "$RUNNER_TEMP/release-update.json" >/dev/null

      - name: Retarget refreshed existing 0.9.0 tag
        if: startsWith(github.ref, 'refs/heads/release/') && env.REFRESH_RELEASE == 'true' && env.RELEASE_EXISTS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = "0.9.0"
          test "$RELEASE_TARGET" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG_NAME" "$RELEASE_TARGET" -m "Sidrena $VERSION"
          git push --force origin "refs/tags/$TAG_NAME"

      - name: Verify published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/sidrena-release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$VERIFY_DIR"

          test -f "$VERIFY_DIR/sidrena-wordpress-$VERSION.zip"
          test -f "$VERIFY_DIR/sidrena-wordpress-$VERSION.zip.sha256"
          test -f "$VERIFY_DIR/sidrena-woocommerce-$VERSION.zip"
          test -f "$VERIFY_DIR/sidrena-woocommerce-$VERSION.zip.sha256"
          test "$(find "$VERIFY_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = "2"
          test "$(find "$VERIFY_DIR" -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')" = "2"
          test "$(find "$VERIFY_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"

          (
            cd "$VERIFY_DIR"
            sha256sum -c "sidrena-wordpress-$VERSION.zip.sha256"
            sha256sum -c "sidrena-woocommerce-$VERSION.zip.sha256"
          )

          unzip -t "$VERIFY_DIR/sidrena-wordpress-$VERSION.zip" >/dev/null
          unzip -t "$VERIFY_DIR/sidrena-woocommerce-$VERSION.zip" >/dev/null

          mkdir -p "$VERIFY_DIR/wp" "$VERIFY_DIR/woo"
          unzip -q "$VERIFY_DIR/sidrena-wordpress-$VERSION.zip" -d "$VERIFY_DIR/wp"
          unzip -q "$VERIFY_DIR/sidrena-woocommerce-$VERSION.zip" -d "$VERIFY_DIR/woo"

          WP="$VERIFY_DIR/wp/sidrena-wordpress"
          WOO="$VERIFY_DIR/woo/sidrena-woocommerce"

          test -f "$WP/sidrena-wordpress.php"
          test -s "$WP/assets/images/logo-wordpress.svg"
          test -s "$WP/assets/images/logo-wordpress-light.svg"
          test ! -e "$WP/assets/images/logo-woocommerce.svg"
          test ! -e "$WP/assets/images/logo-woocommerce-light.svg"
          test -s "$WP/docs/SIDRENA-PODRSKA.pdf"
          test -f "$WP/includes/class-sidrena-standalone.php"
          test ! -f "$WP/includes/class-sidrena-products.php"
          test ! -f "$WP/sidrena.php"
          test ! -d "$WP/static-php"

          test -f "$WOO/sidrena-woocommerce.php"
          test -s "$WOO/assets/images/logo-woocommerce.svg"
          test -s "$WOO/assets/images/logo-woocommerce-light.svg"
          test ! -e "$WOO/assets/images/logo-wordpress.svg"
          test ! -e "$WOO/assets/images/logo-wordpress-light.svg"
          test -s "$WOO/docs/SIDRENA-PODRSKA.pdf"
          test -f "$WOO/includes/class-sidrena-products.php"
          test ! -f "$WOO/includes/class-sidrena-standalone.php"
          test ! -f "$WOO/sidrena.php"
          test ! -d "$WOO/static-php"

          for index in 1 2 3 4 5 6; do
            test -s "$WP/docs/images/screenshot-$index.png"
            test -s "$WOO/docs/images/screenshot-$index.png"
          done

          test -s "$WP/branding/BRAND-GUIDE.md"
          test -s "$WP/branding/website-hero-wordpress.svg"
          test -s "$WP/branding/rendered/website-hero-wordpress.png"
          test -s "$WP/branding/rendered/plugin-cover-wordpress.png"
          test -s "$WP/branding/social-wordpress.svg"
          test -s "$WP/branding/wporg-banner-wordpress.svg"
          test -s "$WP/branding/rendered/social-wordpress.png"
          test -s "$WP/branding/rendered/wporg-banner-wordpress.png"
          test ! -e "$WP/branding/website-hero-woocommerce.svg"
          test ! -e "$WP/branding/wporg-banner-woocommerce.svg"
          test ! -e "$WP/branding/rendered/social-woocommerce.png"
          test ! -e "$WP/branding/rendered/website-hero-woocommerce.png"

          test -s "$WOO/branding/BRAND-GUIDE.md"
          test -s "$WOO/branding/website-hero-woocommerce.svg"
          test -s "$WOO/branding/rendered/website-hero-woocommerce.png"
          test -s "$WOO/branding/rendered/plugin-cover-woocommerce.png"
          test -s "$WOO/branding/social-woocommerce.svg"
          test -s "$WOO/branding/wporg-banner-woocommerce.svg"
          test -s "$WOO/branding/rendered/social-woocommerce.png"
          test -s "$WOO/branding/rendered/wporg-banner-woocommerce.png"
          test ! -e "$WOO/branding/website-hero-wordpress.svg"
          test ! -e "$WOO/branding/wporg-banner-wordpress.svg"
          test ! -e "$WOO/branding/rendered/social-wordpress.png"
          test ! -e "$WOO/branding/rendered/website-hero-wordpress.png"

          if grep -RIniE 'Brendigo[[:space:]]+LTD([[:space:]]+Developer)?' "$WP" "$WOO"; then
            echo 'Retired branding detected inside published ZIP asset.' >&2
            exit 1
          fi


      - name: Verify and normalize stable release metadata
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
          test "$(jq -r '.draft' <<<"$CURRENT_RELEASE")" = "false"
          test "$(jq -r '.prerelease' <<<"$CURRENT_RELEASE")" = "false"
          test "$(jq -r '.target_commitish' <<<"$CURRENT_RELEASE")" = "$RELEASE_TARGET"

          V010_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.1.0") | .id' | head -n1)"
          if [[ "$V010_ID" =~ ^[0-9]+$ ]]; then
            V010_BODY="$(cat <<'EOF'
          ## Sidrena 0.1.0

          Prvo javno izdanje Sidrene isporučuje dva odvojena WordPress plugina:

          - **Sidrena WordPress** — za WordPress web bez WooCommercea.
          - **Sidrena WooCommerce** — za WordPress + WooCommerce.

          Automatski prikaz sidrene cijene, javna Objava cjenika, CSV/XML, arhiva i ugrađena podrška uključeni su u odgovarajući paket.

          Jednokratna instalacija i početno postavljanje od strane Brendiga: 80 EUR.
          Dobrovoljna donacija za razvoj dostupna je izravno preko Revoluta u administraciji plugina.

          Podrška: sidrena@brendigo.com
          Autor: Brendigo
          Službena stranica: https://brendigo.com/sidrene-cijene/
          EOF
          )"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${V010_ID}" \
              -F draft=false \
              -F prerelease=false \
              -f body="$V010_BODY" >/dev/null

            V010_RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${V010_ID}")"
            test "$(jq -r '.draft' <<<"$V010_RELEASE")" = "false"
            test "$(jq -r '.prerelease' <<<"$V010_RELEASE")" = "false"
            RETIRED_BRAND_A='Brendigo[[:space:]]+L''TD'
            RETIRED_BRAND_B='Brendigo L''TD Developer'
            RETIRED_VERSION_A='Sidrena 1\.[0-9]'
            RETIRED_VERSION_B='Sidrena 2\.0\.0'
            if grep -qiE "${RETIRED_BRAND_A}|${RETIRED_BRAND_B}|${RETIRED_VERSION_A}|${RETIRED_VERSION_B}" <<<"$(jq -r '.body // ""' <<<"$V010_RELEASE")"; then
              echo 'Retired branding/version history leaked into v0.1.0 release body.' >&2
              exit 1
            fi
          fi

      - name: Keep only the 0.1.0 GitHub release and tag
        if: env.VERSION == '0.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r RELEASE_ID RELEASE_TAG; do
            if [[ -n "$RELEASE_ID" && "$RELEASE_TAG" != "$TAG_NAME" ]]; then
              echo "Removing retired release $RELEASE_TAG"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
            fi
          done

          git fetch --tags --force
          while IFS= read -r TAG; do
            if [[ -n "$TAG" && "$TAG" != "$TAG_NAME" ]]; then
              echo "Removing retired tag $TAG"
              git push origin --delete "$TAG"
            fi
          done < <(git tag -l)

          REMAINING_RELEASES="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')"
          test "$REMAINING_RELEASES" = "$TAG_NAME"

          REMAINING_TAGS="$(git ls-remote --tags --refs origin | awk '{sub("refs/tags/","",$2); print $2}')"
          test "$REMAINING_TAGS" = "$TAG_NAME"
