name: Build Sidrena release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          HEADER_VERSION="$(sed -n 's/^ \* Version: //p' sidrena.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag: //p' readme.txt | head -n1)"
          test "$VERSION" = "$HEADER_VERSION"
          test "$VERSION" = "$STABLE_TAG"
          STATIC_VERSION="$(sed -n "s/^    public const VERSION = '\([^']*\)';$/\1/p" static-php/src/SidrenaStatic.php | head -n1)"
          test "$VERSION" = "$STATIC_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"

      - name: Create release tag from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" "$GITHUB_SHA" -m "Sidrena $VERSION"
            git push origin "$TAG_NAME"
          fi

      - name: Build WordPress edition archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION:?Release version was not resolved}"
          STAGE="$RUNNER_TEMP/sidrena"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.wordpress-org/' \
            --exclude='static-php/' \
            --exclude='.gitignore' \
            --exclude='README.md'
          cd "$RUNNER_TEMP"
          zip -qr "sidrena-wordpress-${VERSION}.zip" sidrena
          sha256sum "sidrena-wordpress-${VERSION}.zip" > "sidrena-wordpress-${VERSION}.zip.sha256"
          cp "sidrena-wordpress-${VERSION}.zip" "sidrena-${VERSION}.zip"
          sha256sum "sidrena-${VERSION}.zip" > "sidrena-${VERSION}.zip.sha256"

      - name: Build Static PHP edition archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION:?Release version was not resolved}"
          STAGE="$RUNNER_TEMP/sidrena-static-php"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a static-php/ "$STAGE/"
          cd "$RUNNER_TEMP"
          zip -qr "sidrena-static-php-${VERSION}.zip" sidrena-static-php
          sha256sum "sidrena-static-php-${VERSION}.zip" > "sidrena-static-php-${VERSION}.zip.sha256"

      - name: Build WordPress.org visual assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          VERSION="${VERSION:?Release version was not resolved}"
          OUT="$RUNNER_TEMP/wporg-assets"
          mkdir -p "$OUT"
          rsvg-convert -w 772 -h 250 .wordpress-org/source/banner.svg > "$OUT/banner-772x250.png"
          rsvg-convert -w 1544 -h 500 .wordpress-org/source/banner.svg > "$OUT/banner-1544x500.png"
          rsvg-convert -w 128 -h 128 assets/images/logo-mark.svg > "$OUT/icon-128x128.png"
          rsvg-convert -w 256 -h 256 assets/images/logo-mark.svg > "$OUT/icon-256x256.png"
          cp assets/images/logo-mark.svg "$OUT/icon.svg"
          for N in 1 2 3 4 5 6; do
            rsvg-convert -w 1448 -h 1086 ".wordpress-org/source/screenshot-${N}.svg" > "$OUT/screenshot-${N}.png"
          done
          cd "$RUNNER_TEMP"
          zip -qr "sidrena-wporg-assets-${VERSION}.zip" wporg-assets
          sha256sum "sidrena-wporg-assets-${VERSION}.zip" > "sidrena-wporg-assets-${VERSION}.zip.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: Sidrena ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## Sidrena ${{ env.VERSION }}

            Produkcijsko izdanje Sidrene u dvije odvojene distribucije.

            - **WordPress izdanje:** `sidrena-wordpress-${{ env.VERSION }}.zip` (uz kompatibilni alias `sidrena-${{ env.VERSION }}.zip`).
            - **Static PHP izdanje:** `sidrena-static-php-${{ env.VERSION }}.zip` za obične PHP web stranice bez WordPressa, WooCommercea, baze i admin panela.
            - Za svaki instalacijski ZIP objavljen je SHA-256 checksum.
            - WordPress.org vizualni asset paket i njegov SHA-256 također su priloženi.
            - WordPress upute nalaze se u `docs/UPUTE.md`, a Static PHP upute u `static-php/README.md`.
            - Detaljan popis promjena nalazi se u `changelog.txt` i `readme.txt`.

            Službena stranica: https://sidrene-cijene.com.hr/
          files: |
            ${{ runner.temp }}/sidrena-*.zip
            ${{ runner.temp }}/sidrena-*.zip.sha256
