name: Build Sidrena editions release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          WP_VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1)"
          WOO_VERSION="$(sed -n 's/^ \* Version: //p' editions/woocommerce/sidrena-woocommerce.php | head -n1)"
          WP_STABLE="$(sed -n 's/^Stable tag: //p' editions/wordpress/readme.txt | head -n1)"
          WOO_STABLE="$(sed -n 's/^Stable tag: //p' editions/woocommerce/readme.txt | head -n1)"
          test "$VERSION" = "$WP_VERSION"
          test "$VERSION" = "$WOO_VERSION"
          test "$VERSION" = "$WP_STABLE"
          test "$VERSION" = "$WOO_STABLE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"

      - name: Create release tag from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" "$GITHUB_SHA" -m "Sidrena $VERSION"
            git push origin "$TAG_NAME"
          fi

      - name: Install PDF build dependency
        run: python3 -m pip install --disable-pip-version-check --quiet reportlab

      - name: Build WordPress and WooCommerce ZIPs
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-editions.sh "$VERSION" "$RUNNER_TEMP"

      - name: Build WordPress.org visual assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          OUT="$RUNNER_TEMP/wporg-assets"
          mkdir -p "$OUT"
          rsvg-convert -w 772 -h 250 .wordpress-org/source/banner.svg > "$OUT/banner-772x250.png"
          rsvg-convert -w 1544 -h 500 .wordpress-org/source/banner.svg > "$OUT/banner-1544x500.png"
          rsvg-convert -w 128 -h 128 assets/images/logo-mark.svg > "$OUT/icon-128x128.png"
          rsvg-convert -w 256 -h 256 assets/images/logo-mark.svg > "$OUT/icon-256x256.png"
          cp assets/images/logo-mark.svg "$OUT/icon.svg"
          for N in 1 2 3 4 5 6; do
            rsvg-convert -w 1448 -h 1086 ".wordpress-org/source/screenshot-${N}.svg" > "$OUT/screenshot-${N}.png"
          done
          cd "$RUNNER_TEMP"
          zip -qr "sidrena-wporg-assets-${VERSION}.zip" wporg-assets
          sha256sum "sidrena-wporg-assets-${VERSION}.zip" > "sidrena-wporg-assets-${VERSION}.zip.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: Sidrena ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## Sidrena ${{ env.VERSION }}

            Sidrena 0.1.0 isporučuje **dva zasebna WordPress plugina**.

            - **Sidrena WordPress** — `sidrena-wordpress-${{ env.VERSION }}.zip` za WordPress web bez WooCommercea.
            - **Sidrena WooCommerce** — `sidrena-woocommerce-${{ env.VERSION }}.zip` za WordPress + WooCommerce.
            - Nemojte aktivirati oba izdanja istodobno.
            - Za svaki ZIP objavljen je SHA-256 checksum.

            Upute su uključene unutar svakog instalacijskog ZIP-a.

            Službena stranica: https://sidrene-cijene.com.hr/
          files: |
            ${{ runner.temp }}/sidrena-wordpress-${{ env.VERSION }}.zip
            ${{ runner.temp }}/sidrena-wordpress-${{ env.VERSION }}.zip.sha256
            ${{ runner.temp }}/sidrena-woocommerce-${{ env.VERSION }}.zip
            ${{ runner.temp }}/sidrena-woocommerce-${{ env.VERSION }}.zip.sha256
            ${{ runner.temp }}/sidrena-wporg-assets-${{ env.VERSION }}.zip
            ${{ runner.temp }}/sidrena-wporg-assets-${{ env.VERSION }}.zip.sha256
