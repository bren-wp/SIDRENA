# Sidrena source file.
# Author: brendigo
# Author URI: https://brendigo.com/
# Plugin URI: https://brendigo.com/sidrene-cijene/
# Support: sidrena@brendigo.com

name: Build Sidrena editions release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'

permissions:
  contents: write

concurrency:
  group: sidrena-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          WP_VERSION="$(sed -n 's/^ \* Version: //p' editions/wordpress/sidrena-wordpress.php | head -n1 | tr -d '\r')"
          WOO_VERSION="$(sed -n 's/^ \* Version: //p' editions/woocommerce/sidrena-woocommerce.php | head -n1 | tr -d '\r')"
          WP_STABLE="$(sed -n 's/^Stable tag: //p' editions/wordpress/readme.txt | head -n1 | tr -d '\r')"
          WOO_STABLE="$(sed -n 's/^Stable tag: //p' editions/woocommerce/readme.txt | head -n1 | tr -d '\r')"
          test -n "$VERSION"
          test "$VERSION" = "$WP_VERSION"
          test "$VERSION" = "$WOO_VERSION"
          test "$VERSION" = "$WP_STABLE"
          test "$VERSION" = "$WOO_STABLE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Require release branch to match main
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$MAIN_SHA" ]]; then
            echo "$GITHUB_REF_NAME must point at the current main commit before publishing." >&2
            echo "release=$GITHUB_SHA main=$MAIN_SHA" >&2
            exit 1
          fi

      - name: Prepare release body
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sidrena-release-body.md" <<EOF
          ## SIDRENA $VERSION

          SIDRENA $VERSION je produkcijsko izdanje compliance i digital-price-list sustava s dva zasebna instalacijska plugina.

          - **SIDRENA — WordPress izdanje** — samostalni WordPress katalog proizvoda i usluga bez WooCommerce dependencyja.
          - **SIDRENA — WooCommerce izdanje** — postojeći WooCommerce proizvodi i varijacije ostaju izvor kataloga.

          Ovo izdanje usklađuje instalacijske pakete s WordPress.org slug pravilima: glavni PHP file u svakom ZIP-u prati javni slug/folder, dok javni naziv plugina ostaje `SIDRENA`.

          Release gate gradi reproducibilne ZIP pakete, provjerava SHA-256, testira dokumentacijske PDF-ove, pokreće WordPress Plugin Check za oba izdanja i provjerava da objavljeni release asseti sadrže samo očekivane datoteke.

          Podrška: sidrena@brendigo.com
          Autor: brendigo
          Službena stranica: https://brendigo.com/sidrene-cijene/
          EOF

      - name: Install build and render dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet reportlab pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build WordPress and WooCommerce ZIPs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_TARGET")" ./tools/build-editions.sh "$VERSION" "$RUNNER_TEMP"

      - name: Verify reproducible release build
        shell: bash
        run: |
          set -euo pipefail
          REPEAT_OUT="$RUNNER_TEMP/sidrena-release-repeat"
          rm -rf "$REPEAT_OUT"
          mkdir -p "$REPEAT_OUT"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_TARGET")" ./tools/build-editions.sh "$VERSION" "$REPEAT_OUT"
          cmp "$RUNNER_TEMP/sidrena-wordpress-$VERSION.zip" "$REPEAT_OUT/sidrena-wordpress-$VERSION.zip"
          cmp "$RUNNER_TEMP/sidrena-woocommerce-$VERSION.zip" "$REPEAT_OUT/sidrena-woocommerce-$VERSION.zip"
          cmp "$RUNNER_TEMP/sidrena-wordpress-$VERSION.zip.sha256" "$REPEAT_OUT/sidrena-wordpress-$VERSION.zip.sha256"
          cmp "$RUNNER_TEMP/sidrena-woocommerce-$VERSION.zip.sha256" "$REPEAT_OUT/sidrena-woocommerce-$VERSION.zip.sha256"

      - name: Verify release ZIPs and slug entrypoints
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP"
            sha256sum -c "sidrena-wordpress-$VERSION.zip.sha256"
            sha256sum -c "sidrena-woocommerce-$VERSION.zip.sha256"
          )
          unzip -t "$RUNNER_TEMP/sidrena-wordpress-$VERSION.zip" >/dev/null
          unzip -t "$RUNNER_TEMP/sidrena-woocommerce-$VERSION.zip" >/dev/null

          WP="$RUNNER_TEMP/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici"
          WOO="$RUNNER_TEMP/.sidrena-build/brendigo-sidrena-cijena"
          test -f "$WP/brendigo-sidrene-cijene-digitalni-cjenici.php"
          test -f "$WOO/brendigo-sidrena-cijena.php"
          test ! -f "$WP/sidrena-wordpress.php"
          test ! -f "$WOO/sidrena-woocommerce.php"
          grep -Fq 'Plugin Name: SIDRENA' "$WP/brendigo-sidrene-cijene-digitalni-cjenici.php"
          grep -Fq 'Text Domain: brendigo-sidrene-cijene-digitalni-cjenici' "$WP/brendigo-sidrene-cijene-digitalni-cjenici.php"
          grep -Fq 'Plugin Name: SIDRENA' "$WOO/brendigo-sidrena-cijena.php"
          grep -Fq 'Text Domain: brendigo-sidrena-cijena' "$WOO/brendigo-sidrena-cijena.php"
          grep -qiE '^ \* Requires Plugins:.*woocommerce' "$WOO/brendigo-sidrena-cijena.php"
          ! grep -qiE '^ \* Requires Plugins:.*woocommerce' "$WP/brendigo-sidrene-cijene-digitalni-cjenici.php"

      - name: Render and validate release PDF manuals
        shell: bash
        run: |
          set -euo pipefail
          RENDER="$RUNNER_TEMP/sidrena-release-pdf-visual-qa"
          rm -rf "$RENDER"
          mkdir -p "$RENDER"
          python3 tools/pdf-visual-qa.py \
            --pdf "$RUNNER_TEMP/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici/docs/SIDRENA-UPUTE.pdf" \
            --output-dir "$RENDER/wordpress" \
            --label "SIDRENA — WordPress izdanje release"
          python3 tools/pdf-visual-qa.py \
            --pdf "$RUNNER_TEMP/.sidrena-build/brendigo-sidrena-cijena/docs/SIDRENA-UPUTE.pdf" \
            --output-dir "$RENDER/woocommerce" \
            --label "SIDRENA — WooCommerce izdanje release"

      - name: Upload release PDF visual QA renders
        uses: actions/upload-artifact@v7
        with:
          name: sidrena-release-pdf-visual-qa-${{ env.VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/sidrena-release-pdf-visual-qa/

      - name: Stage exact release builds for Plugin Check
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/release-plugin-check
          mkdir -p build/release-plugin-check
          cp -a "$RUNNER_TEMP/.sidrena-build/brendigo-sidrene-cijene-digitalni-cjenici" build/release-plugin-check/
          cp -a "$RUNNER_TEMP/.sidrena-build/brendigo-sidrena-cijena" build/release-plugin-check/
          test -f build/release-plugin-check/brendigo-sidrene-cijene-digitalni-cjenici/brendigo-sidrene-cijene-digitalni-cjenici.php
          test -f build/release-plugin-check/brendigo-sidrena-cijena/brendigo-sidrena-cijena.php

      - name: Set up Node for release Plugin Check
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install deterministic WordPress runtime tooling
        shell: bash
        run: bash tools/install-wp-env.sh "$RUNNER_TEMP/sidrena-wp-env"

      - name: Plugin Check release gate — WordPress edition
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-plugin-check.sh \
            build/release-plugin-check/brendigo-sidrene-cijene-digitalni-cjenici \
            brendigo-sidrene-cijene-digitalni-cjenici \
            "$RUNNER_TEMP/plugin-check-release-wordpress.json"

      - name: Plugin Check release gate — WooCommerce edition
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-plugin-check.sh \
            build/release-plugin-check/brendigo-sidrena-cijena \
            brendigo-sidrena-cijena \
            "$RUNNER_TEMP/plugin-check-release-woocommerce.json"

      - name: Upload release Plugin Check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sidrena-release-plugin-check-${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/plugin-check-release-wordpress.json
            ${{ runner.temp }}/plugin-check-release-woocommerce.json
          if-no-files-found: warn

      - name: Create verified release tag from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            TARGET="$(git rev-list -n 1 "$TAG_NAME")"
            test "$TARGET" = "$RELEASE_TARGET"
          else
            git tag -a "$TAG_NAME" "$RELEASE_TARGET" -m "SIDRENA $VERSION"
            git push origin "$TAG_NAME"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ env.RELEASE_TARGET }}
          name: SIDRENA ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: ${{ runner.temp }}/sidrena-release-body.md
          files: |
            ${{ runner.temp }}/sidrena-wordpress-${{ env.VERSION }}.zip
            ${{ runner.temp }}/sidrena-wordpress-${{ env.VERSION }}.zip.sha256
            ${{ runner.temp }}/sidrena-woocommerce-${{ env.VERSION }}.zip
            ${{ runner.temp }}/sidrena-woocommerce-${{ env.VERSION }}.zip.sha256

      - name: Verify published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/sidrena-release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$VERIFY_DIR"

          WP_ZIP="$VERIFY_DIR/sidrena-wordpress-$VERSION.zip"
          WOO_ZIP="$VERIFY_DIR/sidrena-woocommerce-$VERSION.zip"
          test -f "$WP_ZIP"
          test -f "$VERIFY_DIR/sidrena-wordpress-$VERSION.zip.sha256"
          test -f "$WOO_ZIP"
          test -f "$VERIFY_DIR/sidrena-woocommerce-$VERSION.zip.sha256"
          test "$(find "$VERIFY_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = "2"
          test "$(find "$VERIFY_DIR" -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')" = "2"
          test "$(find "$VERIFY_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"

          for ZIP in "$WP_ZIP" "$WOO_ZIP"; do
            SIZE="$(stat -c%s "$ZIP")"
            echo "$(basename "$ZIP"): $SIZE bytes"
            test "$SIZE" -le 1572864
          done

          (
            cd "$VERIFY_DIR"
            sha256sum -c "sidrena-wordpress-$VERSION.zip.sha256"
            sha256sum -c "sidrena-woocommerce-$VERSION.zip.sha256"
          )

          unzip -t "$WP_ZIP" >/dev/null
          unzip -t "$WOO_ZIP" >/dev/null
          mkdir -p "$VERIFY_DIR/wp" "$VERIFY_DIR/woo"
          unzip -q "$WP_ZIP" -d "$VERIFY_DIR/wp"
          unzip -q "$WOO_ZIP" -d "$VERIFY_DIR/woo"

          WP="$VERIFY_DIR/wp/brendigo-sidrene-cijene-digitalni-cjenici"
          WOO="$VERIFY_DIR/woo/brendigo-sidrena-cijena"
          test -f "$WP/brendigo-sidrene-cijene-digitalni-cjenici.php"
          test -f "$WOO/brendigo-sidrena-cijena.php"
          test ! -f "$WP/sidrena-wordpress.php"
          test ! -f "$WOO/sidrena-woocommerce.php"
          test -s "$WP/assets/images/logo-wordpress.svg"
          test -s "$WP/assets/images/logo-wordpress-light.svg"
          test ! -e "$WP/assets/images/logo-woocommerce.svg"
          test ! -e "$WP/assets/images/logo-woocommerce-light.svg"
          test -s "$WP/docs/UPUTE.md"
          test -s "$WP/docs/SIDRENA-UPUTE.pdf"
          test -f "$WP/includes/class-sidrena-standalone.php"
          test ! -f "$WP/includes/class-sidrena-products.php"
          test -s "$WOO/assets/images/logo-woocommerce.svg"
          test -s "$WOO/assets/images/logo-woocommerce-light.svg"
          test ! -e "$WOO/assets/images/logo-wordpress.svg"
          test ! -e "$WOO/assets/images/logo-wordpress-light.svg"
          test -s "$WOO/docs/UPUTE.md"
          test -s "$WOO/docs/SIDRENA-UPUTE.pdf"
          test -f "$WOO/includes/class-sidrena-products.php"
          test ! -f "$WOO/includes/class-sidrena-standalone.php"
