"#082642" font-size="17" font-weight="820">Evidencija arhive</text><text x="96" y="70" fill="#647a91" font-size="10">Izvezite objave, rokove čuvanja i SHA-256 zapise.</text><rect x="24" y="126" width="145" height="42" rx="9" fill="#6b34ac"/><text x="51" y="152" fill="#fff" font-size="11" font-weight="750">Izvezi arhivu</text></g></g>
